plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenLocal()   // Liskov: publish it first with ..\Liskovuild.bat publishToMavenLocal
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Minecraft 26.1+ is unobfuscated: no mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // 26.3 no longer exposes LWJGL GLFW on the compile classpath (Minecraft provides it at runtime)
    compileOnly "org.lwjgl:lwjgl-glfw:3.4.1"

    // Litematica and malilib only to compile against; the player has them installed
    compileOnly "maven.modrinth:litematica:${project.litematica_version}"
    compileOnly "maven.modrinth:malilib:${project.malilib_version}"

    // Liskov (shared ImGui host, Drives filesystem, file explorer): a separate mod the player installs, compiled against only
    compileOnly "dev.liskov:liskov:${project.liskov_version}"
    testImplementation "dev.liskov:liskov-core:${project.liskov_version}"
    compileOnly "io.github.spair:imgui-java-binding:1.90.0"   // API types only; the real classes ship in Liskov

    // Unit tests for the Minecraft-free shape core (dev.vitruvius.shape)
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test { useJUnitPlatform() }

processResources {
    def props = [version: project.version, minecraft_dep: project.minecraft_dep]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
}
