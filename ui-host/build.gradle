plugins {
    id 'net.fabricmc.fabric-loom'
}

version = '0.1.0'
group = 'dev.cg'
base { archivesName = 'cg-uihost' }

repositories {
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

dependencies {
    // Minecraft 26.1+ is unobfuscated: no mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 26.3 uses SDL3 (LWJGL sdl) for windowing and input; it is on the game classpath at runtime
    compileOnly "org.lwjgl:lwjgl-sdl:3.4.3"

    // Dear ImGui (imgui-java 1.90.0) with the natives for every platform it ships for, bundled into the jar.
    // 1.90.0 has: windows x86_64, linux x86_64, macOS universal (x86_64 + arm64). There are no arm64 builds of
    // the windows/linux natives and the x86 (32 bit) variants stop at 1.82.2.
    shade("io.github.spair:imgui-java-binding:1.90.0")
    shade("io.github.spair:imgui-java-lwjgl3:1.90.0") {
        exclude group: 'org.lwjgl'
    }
    shade("io.github.spair:imgui-java-natives-windows:1.90.0")
    shade("io.github.spair:imgui-java-natives-linux:1.90.0")
    shade("io.github.spair:imgui-java-natives-macos:1.90.0")
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF', 'META-INF/versions/**'
    }
    from("../LICENSE") { rename { "${it}_cg-uihost" } }
}
