<title>Vitruvius Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Layout: the game viewport fills the frame; ImGui-style windows float over it (Manhattan "Hybrid" tokens). Single dark look on purpose: it mocks an in-game UI. */
:root {
  --bg: #131518; --vp: #0e1013; --panel: #191c20; --panel2: #1e2126; --line: #2a2e35; --line2: #22262b;
  --fg: #e2e5e9; --dim: #858c96; --gutter: #4f565f;
  --accent: #5ec4b6; --on-accent: #06221e; --sel: #21403b;
  --ok: #8ad27e; --warn: #f2b35e; --err: #f07470; --bool: #b48cf0;
  --ax-x: #f0605e; --ax-y: #8ad27e; --ax-z: #5b9cf0;
  --btn: #23272d; --chip: #262a31;
  --f-ui: "Inter", system-ui, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-num: "Barlow Condensed", "Inter", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 13px/1.4 var(--f-ui);
  box-sizing: border-box; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { position: relative; height: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--vp); user-select: none; }
#stage { position: absolute; inset: 0; }
#vp { position: absolute; inset: 0; display: block; cursor: default; }

.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* toolbar */
#toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px #0008; z-index: 30; max-width: calc(100% - 20px); }
.mode { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; height: 28px; border-radius: 5px; background: var(--sel); color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.mode kbd { color: var(--fg); }
.tb { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: var(--dim); white-space: nowrap; }
.tb:hover { background: var(--btn); color: var(--fg); }
.tb.on { background: var(--btn); color: var(--accent); box-shadow: inset 0 0 0 1px #5ec4b655; }
.tb .lbl { font-size: 12px; }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; flex: none; }
.tb.push { color: var(--fg); background: var(--btn); }
.tb.push .n { background: var(--warn); color: #2a1a02; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 600; }
.tb.push.clean .n { background: var(--chip); color: var(--dim); }
select.tsel { height: 28px; border: 0; border-radius: 5px; background: var(--btn); color: var(--fg); padding: 0 6px; font-size: 12px; }
kbd { font: 500 10.5px var(--f-mono); padding: 1px 5px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); color: var(--dim); }

/* HUD */
#hud { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 25; padding: 6px 12px; border-radius: 6px; background: #000b; border: 1px solid var(--line); font: 500 12.5px var(--f-mono); white-space: nowrap; pointer-events: none; }
#hud b { color: var(--accent); font-weight: 500; }
#hud .ax-x { color: var(--ax-x); } #hud .ax-y { color: var(--ax-y); } #hud .ax-z { color: var(--ax-z); }
#hud .cur { background: var(--fg); width: 7px; height: 14px; display: inline-block; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* windows */
.win { position: absolute; z-index: 20; display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 32px #0009; backdrop-filter: blur(6px); max-height: calc(100% - 70px); }
.win-h { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--line2); cursor: grab; flex: none; }
.win-h:active { cursor: grabbing; }
.win-h .t { font-weight: 600; font-size: 12.5px; flex: 1; }
.win-h .grip { color: var(--gutter); font: 12px var(--f-mono); letter-spacing: -2px; }
.win-h .hb { border: 0; background: transparent; color: var(--dim); border-radius: 4px; height: 22px; width: 22px; display: grid; place-items: center; }
.win-h .hb:hover { background: var(--btn); color: var(--fg); }
.win-b { padding: 8px; overflow: auto; min-height: 0; }
.win-f { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line2); flex: none; }

/* scene graph */
.search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); margin-bottom: 6px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--fg); font-size: 12.5px; }
.filters { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.chipb { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 12px; height: 22px; padding: 0 9px; font-size: 11.5px; }
.chipb.on { background: var(--sel); color: var(--accent); border-color: #5ec4b655; }
.tree { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 5px; height: 25px; padding-right: 4px; border-radius: 4px; font-size: 12.5px; cursor: default; white-space: nowrap; }
.row:hover { background: #ffffff08; }
.row.sel { background: var(--sel); }
.row.sel .nm { color: #fff; }
.row.owner-sel { background: #21403b88; }
.row.hid .nm, .row.hid .i.ty { opacity: .45; }
.row.locked .nm { color: var(--dim); font-style: italic; }
.row .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--gutter); border: 0; background: transparent; padding: 0; flex: none; }
.row .tw .i { width: 12px; height: 12px; transition: transform .12s; }
.row .tw.open .i { transform: rotate(90deg); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row.proj { font-weight: 600; height: 28px; margin-top: 4px; }
.row.proj .nm { color: var(--fg); }
.ty { color: var(--dim); }
.ty.t-project { color: var(--accent); } .ty.t-assembly { color: #d6a8ff; } .ty.t-area { color: var(--warn); } .ty.t-folder { color: #c9b27a; } .ty.t-object { color: #9fb4c9; } .ty.t-loose { color: var(--gutter); }
.bdg { display: inline-flex; align-items: center; gap: 2px; height: 17px; padding: 0 5px; border-radius: 4px; background: var(--chip); color: var(--dim); font: 500 10.5px var(--f-mono); flex: none; }
.bdg .i { width: 11px; height: 11px; }
.bdg.arr { color: var(--accent); } .bdg.lnk { color: #d6a8ff; } .bdg.bool { color: var(--bool); } .bdg.prio { color: var(--fg); } .bdg.act { background: var(--accent); color: var(--on-accent); font-family: var(--f-ui); font-weight: 600; }
.bdg.trim { color: var(--err); }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.eye { border: 0; background: transparent; color: var(--gutter); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; padding: 0; flex: none; }
.eye:hover { color: var(--fg); background: var(--btn); }
.row.hid .eye { color: var(--dim); }

/* properties */
.ph { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ph input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 600; }
.file { font: 11px var(--f-mono); color: var(--dim); margin: 0 0 10px; word-break: break-all; }
.sec { border-top: 1px solid var(--line2); padding: 9px 0 8px; display: flex; flex-direction: column; gap: 7px; }
.sec > h4 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.sec > h4 .sp { flex: 1; }
.fr { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; }
.fr > span { color: var(--dim); font-size: 12px; }
.xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.num { display: flex; align-items: center; height: 26px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line2); overflow: hidden; }
.num i { font-style: normal; font: 600 10.5px var(--f-mono); width: 18px; text-align: center; align-self: stretch; display: grid; place-items: center; }
.num.x i { background: #f0605e22; color: var(--ax-x); } .num.y i { background: #8ad27e22; color: var(--ax-y); } .num.z i { background: #5b9cf022; color: var(--ax-z); }
.num input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none; padding: 0 6px; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.seg { display: flex; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--dim); height: 22px; border-radius: 3px; font: 12px var(--f-mono); }
.seg button.on { background: var(--btn); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn { height: 26px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--gutter); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.wide { flex: 1; }
.mod { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.mod-h { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border-bottom: 1px solid var(--line2); font-weight: 600; font-size: 12.5px; }
.mod-h .sp { flex: 1; }
.mod-b { padding: 8px; display: flex; flex-direction: column; gap: 7px; }
.mod.m-array .mod-h .i { color: var(--accent); } .mod.m-bool .mod-h .i { color: var(--bool); }
.note { font-size: 11.5px; color: var(--dim); line-height: 1.45; }
.note.err { color: var(--err); }
.note.warnc { color: var(--warn); }
.kv { display: flex; justify-content: space-between; font-size: 12px; } .kv b { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.bignum { font: 600 26px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.stat { display: flex; gap: 14px; }
.stat > div { display: flex; flex-direction: column; gap: 2px; } .stat small { color: var(--dim); font-size: 11px; }
.selc { width: 100%; height: 26px; border-radius: 5px; border: 1px solid var(--line2); background: var(--panel2); padding: 0 6px; font-size: 12px; }
.empty { padding: 18px 6px; color: var(--dim); text-align: center; font-size: 12.5px; line-height: 1.6; }

/* map */
#map { display: block; width: 100%; height: 190px; border-radius: 5px; background: #0b0d10; cursor: crosshair; }
.maplg { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.maplg span { display: inline-flex; align-items: center; gap: 4px; }
.maplg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* status bar */
#status { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; gap: 14px; padding: 0 10px; background: color-mix(in srgb, var(--panel) 96%, transparent); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); z-index: 30; white-space: nowrap; overflow: hidden; }
#status .hints { display: flex; gap: 10px; flex: 1; min-width: 0; overflow: hidden; }
#status .hints span { display: inline-flex; gap: 4px; align-items: center; }
#status .rt { display: flex; gap: 14px; align-items: center; }
#status .rt span { display: inline-flex; gap: 5px; align-items: center; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--warn); border-right-color: transparent; animation: sp .7s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }

/* context menu */
.menu { position: fixed; z-index: 100; min-width: 236px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 12px 36px #000a; font-size: 12.5px; }
.menu .mh { padding: 6px 8px 4px; font-size: 10.5px; color: var(--dim); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 27px; padding: 0 8px; border: 0; background: transparent; border-radius: 4px; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--sel); outline: none; }
.menu button .l { flex: 1; }
.menu button .i { color: var(--dim); }
.menu button.danger { color: var(--err); } .menu button.danger .i { color: var(--err); }
.menu button[disabled] { opacity: .4; pointer-events: none; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 2px; }

/* toasts */
#toasts { position: absolute; right: 12px; bottom: 40px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; z-index: 60; pointer-events: none; }
.toast { padding: 7px 12px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 6px 20px #0008; font-size: 12.5px; max-width: 380px; animation: tin .18s ease-out; }
.toast b { color: var(--accent); font-weight: 600; }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast, .row .tw .i { animation: none; transition: none; } .spin, #hud .cur { animation: none; } }

/* narrow screens: stack the windows under the viewport */
@media (max-width: 860px) {
  body { height: auto; }
  #app { height: auto; overflow: visible; border: 0; background: transparent; }
  #stage { position: relative; height: 460px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--vp); }
  #toolbar { left: 8px; right: 8px; transform: none; overflow-x: auto; max-width: none; }
  .win { position: static !important; width: auto !important; max-height: none; margin-top: 12px; box-shadow: none; }
  .win-h { cursor: default; }
  #status .hints { display: none; }
}
</style>

<div id="app">
  <div id="stage">
    <canvas id="vp" aria-label="Game viewport (mock)"></canvas>
    <div id="toolbar" role="toolbar" aria-label="Editor tools"></div>
    <div id="hud" hidden></div>
    <div id="status"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>

  <section class="win" id="w-scene" style="left:12px; top:58px; width:318px; height:calc(100% - 100px)">
    <header class="win-h" data-drag><svg class="i" viewBox="0 0 16 16"><path d="M8 1.5l6.5 3.5L8 8.5 1.5 5zM1.5 8L8 11.5 14.5 8M1.5 11L8 14.5 14.5 11"/></svg><span class="t">Scene</span><span class="grip">⋮⋮</span></header>
    <div class="win-b">
      <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" placeholder="Filter objects…" aria-label="Filter objects"></label>
      <div class="filters" id="filters"></div>
      <div class="tree" id="tree" role="tree"></div>
    </div>
    <div class="win-f">
      <button class="btn wide" id="b-newproj"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New project</button>
      <button class="btn wide" id="b-openproj">Open project…</button>
    </div>
  </section>

  <section class="win" id="w-props" style="right:12px; top:58px; width:306px; max-height:calc(100% - 330px)">
    <header class="win-h" data-drag><svg class="i" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.5"/><circle cx="10" cy="8" r="1.5"/><circle cx="7" cy="12" r="1.5"/></svg><span class="t">Properties</span><span class="grip">⋮⋮</span></header>
    <div class="win-b" id="props"></div>
  </section>

  <section class="win" id="w-map" style="right:12px; bottom:40px; width:306px">
    <header class="win-h" data-drag><svg class="i" viewBox="0 0 16 16"><path d="M1.5 3.5l4-2 5 2 4-2v11l-4 2-5-2-4 2zM5.5 1.5v11M10.5 3.5v11"/></svg><span class="t">Top view</span><span class="grip">⋮⋮</span></header>
    <div class="win-b">
      <canvas id="map" aria-label="Top-down map"></canvas>
      <div class="maplg"><span><i style="background:var(--accent)"></i>selected</span><span><i style="background:#8a8f96"></i>object</span><span><i style="border:1px dashed var(--warn)"></i>dig area</span><span><i style="background:var(--err)"></i>overlap</span></div>
    </div>
  </section>
</div>

<div class="menu" id="ctx" role="menu" hidden></div>

  const rows = [];
  const row = (n, depth, locked, hiddenUp) => {
    if ((query || filter !== 'all') && !matches(n)) return;
    const kids = n.children && n.children.length, open = n.open || query || filter !== 'all';
    const owner = ownerOf(n.id), isSel = sel.includes(n.id), ownSel = !isSel && sel.includes(owner) && owner !== n.id;
    const hid = n.hidden || hiddenUp, am = arrayMod(n), bm = boolMod(n);
    let badges = '';
    if (n.type === 'project') { badges += n.active ? '<span class="bdg act">ACTIVE</span>' : ''; badges += `<span class="sdot" title="${n.sync === 'shared' ? 'Shared on Syncmatica' : 'Local only'}" style="background:${n.sync === 'shared' ? 'var(--ok)' : 'var(--gutter)'}"></span>`; }
    if (n.linked || n.linkOf) badges += `<span class="bdg lnk" title="Linked: ${esc(n.linked || n.linkOf)}">${ic('link')}</span>`;
    if (am) badges += `<span class="bdg arr" title="Array modifier">${ic('array')}×${am.count}</span>`;
    if (bm) badges += `<span class="bdg bool" title="Boolean modifier">${ic('bool')}</span>`;
    if (trims[n.id]) badges += `<span class="bdg trim" title="Blocks trimmed by an object in front">−${fmt(trims[n.id])}</span>`;
    if (n.prio != null && !locked && hasTransform(n) && !n.wire && n.type !== 'area') badges += `<span class="bdg prio" title="Front order (1 = front)">P${n.prio}</span>`;
    if (locked) badges += `<span class="bdg" title="Part of a linked assembly">${ic('lock')}</span>`;
    const icon = n.type === 'object' && n.wire ? 'bool' : n.type;
    rows.push(`<div class="row ${n.type === 'project' || n.type === 'loose' ? 'proj' : ''} ${isSel ? 'sel' : ''} ${ownSel ? 'owner-sel' : ''} ${hid ? 'hid' : ''} ${locked ? 'locked' : ''}" role="treeitem" aria-selected="${isSel}" data-id="${n.id}" style="padding-left:${4 + depth*14}px">
      ${kids ? `<button class="tw ${open ? 'open' : ''}" data-act="tw" aria-label="${open ? 'Collapse' : 'Expand'}">${ic('chev')}</button>` : '<span class="tw"></span>'}
      ${ic(icon, 'ty t-' + n.type)}<span class="nm" title="${esc(n.file || n.path || n.name)}">${esc(n.name)}</span>${badges}
      ${n.type !== 'loose' ? `<button class="eye" data-act="eye" aria-label="${n.hidden ? 'Show' : 'Hide'} ${esc(n.name)}">${ic(n.hidden ? 'eyeoff' : 'eye')}</button>` : ''}
    </div>`);
    if (kids && open) n.children.forEach(c => row(c, depth + 1, locked || (n.type === 'assembly' && !!n.linked), hid));
  };
  tree.forEach(n => row(n, 0, false, false));
  $('#tree').innerHTML = rows.join('') || '<div class="empty">Nothing matches this filter.</div>';
}
$('#tree').addEventListener('click', e => {

/* ---------- top view ---------- */
const mc = $('#map'), mg = mc.getContext('2d'); let mapXf = null;
function drawMap() {
  const r = mc.getBoundingClientRect(); if (!r.width) return;
  mc.width = r.width * DPR; mc.height = r.height * DPR; mg.setTransform(DPR, 0, 0, DPR, 0, 0);
  mg.fillStyle = '#0b0d10'; mg.fillRect(0, 0, r.width, r.height);
  const all = lastBoxes; if (!all.length) return;
  const [mn, mx] = aabb(all.flatMap(b => [b.mn, b.mx]));
  const pad = 10, sc = Math.min((r.width - pad*2) / (mx[0]-mn[0] + 8), (r.height - pad*2) / (mx[2]-mn[2] + 8));
  const ox = pad + ((r.width - pad*2) - (mx[0]-mn[0])*sc) / 2 - mn[0]*sc, oz = pad + ((r.height - pad*2) - (mx[2]-mn[2])*sc) / 2 - mn[2]*sc;
  mapXf = { sc, ox, oz };
  mg.strokeStyle = '#ffffff0a'; mg.lineWidth = 1;
  for (let x = Math.ceil(mn[0]/16)*16; x <= mx[0]; x += 16) { mg.beginPath(); mg.moveTo(ox + x*sc, 0); mg.lineTo(ox + x*sc, r.height); mg.stroke(); }
  for (let z = Math.ceil(mn[2]/16)*16; z <= mx[2]; z += 16) { mg.beginPath(); mg.moveTo(0, oz + z*sc); mg.lineTo(r.width, oz + z*sc); mg.stroke(); }
  const rect = b => [ox + b.mn[0]*sc, oz + b.mn[2]*sc, (b.mx[0]-b.mn[0])*sc, (b.mx[2]-b.mn[2])*sc];
  all.filter(b => b.kind === 'area').forEach(b => { mg.setLineDash([4, 3]); mg.strokeStyle = sel.includes(b.owner) ? '#5ec4b6' : '#f2b35ecc'; mg.strokeRect(...rect(b)); mg.setLineDash([]); });
  all.filter(b => b.kind === 'solid').sort((a, b) => a.mx[1] - b.mx[1]).forEach(b => { mg.fillStyle = sel.includes(b.owner) ? (b.copy ? '#5ec4b699' : '#5ec4b6') : shade(b.node.color, b.copy ? .7 : .9); mg.fillRect(...rect(b)); mg.strokeStyle = '#0008'; mg.strokeRect(...rect(b)); });
  all.filter(b => b.kind === 'wire').forEach(b => { mg.setLineDash([2, 2]); mg.strokeStyle = '#b48cf0'; mg.strokeRect(...rect(b)); mg.setLineDash([]); });
  lastOverlaps.forEach(o => { mg.fillStyle = '#f07470'; mg.fillRect(...rect(o)); });
  // camera
  const cx0 = ox + S.t[0]*sc, cz0 = oz + S.t[2]*sc, sa = Math.sin(S.yaw), ca = Math.cos(S.yaw), d = 26;
  const camx = cx0 + sa*d, camz = cz0 + ca*d, lx = -sa, lz = -ca;
  mg.fillStyle = '#e2e5e922'; mg.beginPath(); mg.moveTo(camx, camz);
  mg.lineTo(camx + (lx*ca - lz*-sa*0)*0 + (lx*Math.cos(.5) - lz*Math.sin(.5))*40, camz + (lx*Math.sin(.5) + lz*Math.cos(.5))*40);
  mg.lineTo(camx + (lx*Math.cos(-.5) - lz*Math.sin(-.5))*40, camz + (lx*Math.sin(-.5) + lz*Math.cos(-.5))*40); mg.closePath(); mg.fill();
  mg.fillStyle = '#e2e5e9'; mg.beginPath(); mg.arc(camx, camz, 3.5, 0, 7); mg.fill();
  mg.strokeStyle = '#e2e5e955'; mg.beginPath(); mg.arc(cx0, cz0, 3, 0, 7); mg.stroke();
}
mc.addEventListener('click', e => {
  if (!mapXf) return; const r = mc.getBoundingClientRect(), x = (e.clientX - r.left - mapXf.ox) / mapXf.sc, z = (e.clientY - r.top - mapXf.oz) / mapXf.sc;
  const hit = [...lastBoxes].reverse().find(b => b.kind === 'solid' && x >= b.mn[0] && x <= b.mx[0] && z >= b.mn[2] && z <= b.mx[2]) || lastBoxes.find(b => b.kind === 'area' && x >= b.mn[0] && x <= b.mx[0] && z >= b.mn[2] && z <= b.mx[2]);
  if (hit) select(hit.owner, e.shiftKey); else { S.t[0] = x; S.t[2] = z; draw(); drawMap(); toast('Camera moved to the clicked spot'); }

    const app = $('#app').getBoundingClientRect(), r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    w.style.right = 'auto'; w.style.bottom = 'auto'; w.style.left = (r.left - app.left) + 'px'; w.style.top = (r.top - app.top) + 'px';
    const mv = ev => { w.style.left = Math.max(0, Math.min(app.width - 80, ev.clientX - app.left - dx)) + 'px'; w.style.top = Math.max(0, Math.min(app.height - 32, ev.clientY - app.top - dy)) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up); e.preventDefault();
  });
});
