<meta charset="utf-8">
<title>Litematica Array 2.0 — Design Proposal (Gemini)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@600&display=swap');

/* Hybrid UiTheme tokens (from UiTheme.java & Widgets.java) */
:root {
  --bg: #131518; --vp: #0e1013; --panel: #191c20; --panel2: #1e2126;
  --line: #2a2e35; --line2: #22262b; --slot: #1c1f24; --track: #2a2f36;
  --fg: #e2e5e9; --dim: #858c96; --gutter: #4f565f;
  --accent: #5ec4b6; --on-accent: #06221e; --sel: #21403b; --runline: #18302d;
  --ok: #8ad27e; --warn: #f2b35e; --err: #f07470; --bool: #b48cf0;
  --ax-x: #f0605e; --ax-y: #8ad27e; --ax-z: #5b9cf0;
  --btn: #23272d; --chip: #262a31;
  --f-ui: "Inter", system-ui, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-num: "Barlow Condensed", "Inter", sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; max-width: 100%; height: 100%;
  background: var(--bg); color: var(--fg); font: 13px/1.4 var(--f-ui);
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 500 10px var(--f-mono); padding: 1px 5px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }

/* Docked 3-zone ImGui workspace (zero blur shaders, crisp PANEL surfaces) */
#app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 316px;
  grid-template-rows: minmax(0, 1fr) auto;
  width: 100%; max-width: 100%; height: 100vh;
  background: var(--bg); user-select: none; overflow: hidden;
}
#app.zen { grid-template-columns: 0px minmax(0, 1fr) 0px; }
#app.zen .dock { display: none; }

/* Docked side rails */
.dock {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--panel); border-color: var(--line); border-style: solid; border-width: 0;
  z-index: 10;
}
#dock-left { border-right-width: 1px; }
#dock-right { border-left-width: 1px; }

.dock-h {
  display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px;
  background: var(--panel2); border-bottom: 1px solid var(--line); flex: none;
}
.dock-h .t { font-weight: 600; font-size: 12px; letter-spacing: .02em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb {
  border: 1px solid transparent; background: transparent; color: var(--dim);
  border-radius: 4px; height: 22px; min-width: 22px; padding: 0 5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px;
}
.hb:hover { background: var(--btn); border-color: var(--line); color: var(--fg); }
.hb.on { background: var(--sel); color: var(--accent); border-color: #5ec4b655; }

.dock-b { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px; }
.dock-f { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--panel2); flex: none; }

/* Center viewport stage */
#stage {
  position: relative; min-width: 0; min-height: 0; background: var(--vp); overflow: hidden;
}
#vp { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#vp.eyedrop { cursor: crosshair; }

/* Responsive floating toolbar */
#toolbar {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 3px;
  padding: 4px 5px; max-width: calc(100% - 16px);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px #0008; z-index: 30;
}
.tgroup { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.mode {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; height: 26px;
  border-radius: 4px; background: var(--sel); color: var(--accent);
  font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.mode kbd { color: var(--fg); background: var(--runline); border-color: #5ec4b644; }
.tb {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 7px;
  border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--dim);
  white-space: nowrap; font-size: 12px;
}
.tb:hover { background: var(--btn); color: var(--fg); }
.tb.on { background: var(--sel); color: var(--accent); border-color: #5ec4b655; }
.tb.pri { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tb.pri:hover { filter: brightness(1.06); color: var(--on-accent); }
.tb.push { background: var(--btn); border-color: var(--line); color: var(--fg); }
.tb.push .n { background: var(--warn); color: #2a1a02; border-radius: 8px; padding: 0 5px; font-size: 10.5px; font-weight: 600; }
.tb.push.clean .n { background: var(--chip); color: var(--dim); }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; flex: none; }
select.tsel { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--btn); color: var(--fg); padding: 0 5px; font-size: 11.5px; }

/* Multi-mode HUD pill */
#hud {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 8px;
  max-width: calc(100% - 16px); padding: 6px 11px; border-radius: 6px;
  background: color-mix(in srgb, var(--panel2) 94%, transparent);
  border: 1px solid var(--line); box-shadow: 0 8px 24px #0009;
  font: 500 12px var(--f-mono); z-index: 25;
}
#hud[hidden] { display: none; }
.hud-badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; background: var(--sel); color: var(--accent);
}
.hud-badge.fly { background: #5b9cf028; color: var(--ax-z); }
.hud-axes { display: inline-flex; gap: 3px; }
.axchip {
  border: 1px solid var(--line); background: var(--slot); color: var(--dim);
  border-radius: 4px; padding: 1px 6px; font: 600 11px var(--f-mono);
}
.axchip.on-x { background: #f0605e2a; color: var(--ax-x); border-color: var(--ax-x); }
.axchip.on-y { background: #8ad27e2a; color: var(--ax-y); border-color: var(--ax-y); }
.axchip.on-z { background: #5b9cf02a; color: var(--ax-z); border-color: var(--ax-z); }
.hud-val { font: 600 18px/1 var(--f-num); color: var(--fg); letter-spacing: .02em; }
.hud-cur { display: inline-block; width: 6px; height: 13px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
.hud-snap { color: var(--accent); background: var(--sel); padding: 1px 6px; border-radius: 4px; font-size: 11px; }
.hud-note { color: var(--dim); font: 11.5px var(--f-ui); }
.speedbar { display: inline-flex; align-items: center; gap: 5px; }
.speedbar i { display: inline-block; width: 52px; height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
.speedbar i b { display: block; height: 100%; background: var(--ax-z); }
@keyframes blink { 50% { opacity: 0; } }

/* Quick Add & Onboarding Popovers */
.pop {
  position: absolute; z-index: 50; width: min(320px, calc(100% - 16px));
  background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 12px 32px #000b; padding: 8px;
}
.pop[hidden] { display: none; }
.pop-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; border-bottom: 1px solid var(--line2); margin-bottom: 6px; font-weight: 600; font-size: 12px; }
.pop-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px;
  border: 0; border-radius: 4px; background: transparent; text-align: left; font-size: 12.5px;
}
.pop-item:hover { background: var(--sel); }
.pop-item small { display: block; color: var(--dim); font-size: 11px; }
.guide-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line2); font-size: 12px; }
.guide-row:last-child { border-bottom: 0; }
.guide-row b { color: var(--dim); font-weight: 500; }

/* Scene Graph (3-zone fixed-rail rows) */
.search {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
  border-radius: 5px; background: var(--slot); border: 1px solid var(--line); color: var(--dim); margin-bottom: 7px;
}
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--fg); font-size: 12.5px; }
.filters { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.chipb { border: 1px solid var(--line); background: var(--btn); color: var(--dim); border-radius: 11px; height: 22px; padding: 0 8px; font-size: 11px; }
.chipb.on { background: var(--sel); color: var(--accent); border-color: #5ec4b666; }
.chipb.warn.on { background: #f0747024; color: var(--err); border-color: #f0747066; }

.tree { display: flex; flex-direction: column; gap: 1px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 5px;
  min-height: 26px; padding-right: 4px; border-radius: 4px; font-size: 12.5px; cursor: default;
}
.row:hover { background: #ffffff08; }
.row.sel { background: var(--sel); }
.row.sel .nm { color: #fff; }
.row.owner-sel { background: var(--runline); }
.row.hid .nm, .row.hid .ty { opacity: .45; }
.row.locked .nm { color: var(--dim); }
.row.proj { font-weight: 600; min-height: 28px; margin-top: 4px; background: var(--panel2); border: 1px solid var(--line2); }
.row.proj.sel { background: var(--sel); border-color: #5ec4b655; }

.row-main { display: flex; align-items: center; gap: 5px; min-width: 0; }
.tw { width: 15px; height: 15px; display: grid; place-items: center; color: var(--gutter); border: 0; background: transparent; padding: 0; flex: none; }
.tw .i { width: 11px; height: 11px; transition: transform .12s; }
.tw.open .i { transform: rotate(90deg); }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ty { color: var(--dim); }
.ty.t-project { color: var(--accent); } .ty.t-assembly { color: var(--bool); }
.ty.t-area { color: var(--warn); } .ty.t-folder { color: #c9b27a; }
.ty.t-object { color: #9fb4c9; } .ty.t-loose { color: var(--gutter); }

.row-meta { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.row-rail { display: inline-flex; align-items: center; gap: 3px; flex: none; justify-content: flex-end; }
.bdg {
  display: inline-flex; align-items: center; gap: 2px; height: 17px; padding: 0 5px;
  border-radius: 4px; background: var(--chip); color: var(--dim); font: 500 10.5px var(--f-mono); white-space: nowrap;
}
.bdg .i { width: 10px; height: 10px; }
.bdg.mod { color: var(--accent); border: 1px solid #5ec4b633; }
.bdg.lnk { color: var(--bool); border: 1px solid #b48cf033; }
.bdg.trim { background: #f0747022; color: var(--err); border: 1px solid #f0747055; }
.bdg.act { background: var(--accent); color: var(--on-accent); font-family: var(--f-ui); font-weight: 600; font-size: 10px; }
.prio-btn {
  height: 18px; min-width: 28px; padding: 0 4px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--slot); color: var(--dim);
  font: 600 10.5px var(--f-mono); text-align: center;
}
.prio-btn:hover { border-color: var(--accent); color: var(--fg); }
.prio-btn.hot { border-color: #f0747088; color: var(--err); background: #f0747018; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.eye { border: 0; background: transparent; color: var(--gutter); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; padding: 0; }
.eye:hover { color: var(--fg); background: var(--btn); }

/* Right Inspector split: Properties + collapsible Top View */
#inspector-split { display: flex; flex-direction: column; flex: 1; min-height: 0; }
#props-pane { flex: 1; min-height: 120px; overflow-y: auto; overflow-x: hidden; padding: 10px; }
#splitter {
  height: 6px; flex: none; background: var(--panel2); border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line); cursor: ns-resize; display: grid; place-items: center;
}
#splitter::after { content: ""; width: 28px; height: 2px; border-radius: 2px; background: var(--gutter); }
#map-pane { flex: none; background: var(--panel); display: flex; flex-direction: column; }
#map-pane.collapsed #map-body { display: none; }
#map-body { padding: 8px 10px 10px; }
#map { display: block; width: 100%; height: 170px; border-radius: 5px; background: #0b0d10; border: 1px solid var(--line2); cursor: crosshair; }
.maplg { display: flex; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.maplg span { display: inline-flex; align-items: center; gap: 4px; }
.maplg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* Properties controls (Widgets.java tile style) */
.ph { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.ph input {
  flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--slot); font-weight: 600;
}
.file { font: 11px var(--f-mono); color: var(--dim); margin: 0 0 8px; overflow-wrap: anywhere; }
.banner {
  padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2);
  margin-bottom: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px;
}
.banner.lnk { border-left: 3px solid var(--bool); }
.banner.loose { border-left: 3px solid var(--warn); }
.banner.multi { border-left: 3px solid var(--accent); }

.sec { border-top: 1px solid var(--line2); padding: 9px 0 8px; display: flex; flex-direction: column; gap: 7px; }
.sec > h4 {
  margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); display: flex; align-items: center; gap: 6px;
}
.sec > h4 .sp { flex: 1; }
.fr { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 7px; }
.fr > span { color: var(--dim); font-size: 12px; }
.xyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; min-width: 0; }

/* Nudge stepper numeric input */
.num {
  display: flex; align-items: center; height: 26px; min-width: 0;
  border-radius: 5px; background: var(--slot); border: 1px solid var(--line); overflow: hidden;
}
.num i {
  font-style: normal; font: 600 10px var(--f-mono); width: 15px; flex: none;
  align-self: stretch; display: grid; place-items: center;
}
.num.x i { background: #f0605e22; color: var(--ax-x); }
.num.y i { background: #8ad27e22; color: var(--ax-y); }
.num.z i { background: #5b9cf022; color: var(--ax-z); }
.num input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none;
  padding: 0 3px; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right;
}
.num input::-webkit-inner-spin-button { -webkit-appearance: none; }
.step-col { display: flex; flex-direction: column; align-self: stretch; width: 14px; flex: none; border-left: 1px solid var(--line2); }
.step-col button {
  flex: 1; border: 0; background: var(--btn); color: var(--dim); padding: 0;
  font-size: 9px; line-height: 1; display: grid; place-items: center;
}
.step-col button:hover { background: var(--chip); color: var(--fg); }
.step-col button:first-child { border-bottom: 1px solid var(--line2); }

.seg { display: flex; background: var(--slot); border: 1px solid var(--line); border-radius: 5px; padding: 2px; gap: 2px; min-width: 0; }
.seg button { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--dim); height: 22px; border-radius: 3px; font: 11.5px var(--f-mono); }
.seg button.on { background: var(--sel); color: var(--accent); }

.btn {
  height: 26px; padding: 0 9px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--btn); color: var(--fg); font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
}
.btn:hover:not([disabled]) { border-color: var(--gutter); background: var(--chip); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.ghost:hover { background: var(--btn); color: var(--fg); }
.btn.wide { flex: 1; min-width: 0; }
.rowbtns { display: flex; gap: 5px; flex-wrap: wrap; }

/* Modifier cards (collapsible, toggleable, reorderable) */
.mod { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); overflow: hidden; }
.mod.m-array { border-left: 3px solid var(--accent); }
.mod.m-bool { border-left: 3px solid var(--bool); }
.mod.off { opacity: .55; }
.mod-h {
  display: flex; align-items: center; gap: 5px; min-height: 30px; padding: 3px 6px;
  border-bottom: 1px solid var(--line2); font-weight: 600; font-size: 12px;
}
.mod.collapsed .mod-h { border-bottom: 0; }
.mod.collapsed .mod-b { display: none; }
.mod-h .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-h .sub { font: 500 10.5px var(--f-mono); color: var(--dim); }
.mod-b { padding: 8px; display: flex; flex-direction: column; gap: 7px; }

.note { font-size: 11.5px; color: var(--dim); line-height: 1.45; margin: 0; }
.note.err { color: var(--err); }
.note.warnc { color: var(--warn); }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.kv b { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.bignum { font: 600 26px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.stat { display: flex; gap: 16px; flex-wrap: wrap; }
.stat > div { display: flex; flex-direction: column; gap: 2px; }
.stat small { color: var(--dim); font-size: 11px; }
.selc { width: 100%; min-width: 0; height: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--slot); padding: 0 6px; font-size: 12px; }

/* Onboarding Litematica translation card */
.onboard { border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); padding: 10px; display: flex; flex-direction: column; gap: 7px; }
.onboard h5 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
.ob-map { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 8px; font-size: 12px; align-items: baseline; }
.ob-map span { color: var(--dim); font-size: 11px; }

/* Contextual Status Bar */
#status {
  grid-column: 1 / -1; min-height: 28px; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px 14px; padding: 3px 10px;
  background: var(--panel2); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); z-index: 30;
}
#status .hints { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
#status .hints span { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
#status .rt { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#status .rt span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--warn); border-right-color: transparent; animation: sp .7s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }

/* Context Menu with Submenus */
.menu {
  position: fixed; z-index: 100; width: 228px; max-width: calc(100vw - 16px);
  padding: 4px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 12px 34px #000b; font-size: 12.5px;
}
.menu .mh { padding: 5px 8px 4px; font-size: 10.5px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mitem { position: relative; }
.mbtn {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 27px; padding: 0 8px;
  border: 0; background: transparent; border-radius: 4px; text-align: left;
}
.mbtn:hover, .mbtn:focus-visible, .mitem.open > .mbtn { background: var(--sel); outline: none; }
.mbtn .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbtn .i { color: var(--dim); }
.mbtn.danger { color: var(--err); } .mbtn.danger .i { color: var(--err); }
.mbtn[disabled] { opacity: .4; pointer-events: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.submenu {
  display: none; position: absolute; top: -4px; left: calc(100% + 2px);
  width: 224px; padding: 4px; background: var(--panel2); border: 1px solid var(--line);

          drag.base.forEach(([id, p]) => { byId[id].pos = [p[0]+dvec[0], p[1]+dvec[1], p[2]+dvec[2]]; });
          snapped = best.name;
          // build snap target face quad
          const o = best.o, v = best.isMax ? o.mx[best.ax] : o.mn[best.ax], [u, w] = [0,1,2].filter(k => k !== best.ax);
          const mk = (iu, iw) => { const pt=[0,0,0]; pt[best.ax]=v; pt[u]=iu; pt[w]=iw; return pt; };
          snapFace = [mk(o.mn[u],o.mn[w]), mk(o.mx[u],o.mn[w]), mk(o.mx[u],o.mx[w]), mk(o.mn[u],o.mx[w])];
        }
      }
    }
  }
  drag.dx = dvec[0]; drag.dy = dvec[1]; drag.dz = dvec[2];
  drag.snapped = snapped; drag.snapFace = snapFace;
}

function hud() {
  const h = $('#hud');
  if (tt) {
    const ax = tt.axis;
    const axisPills = tt.mode === 'move'
      ? `<div class="hud-axes">${AXN.map((n,i) => `<button class="axchip ${ax===i?'on-'+n:''}" data-ttax="${i}">${n.toUpperCase()}</button>`).join('')}</div>`
      : `<div class="hud-axes"><span class="axchip on-y">Y (90°)</span></div>`;
    h.innerHTML = `<span class="hud-badge">${tt.mode === 'move' ? 'MOVE' : 'ROTATE'}</span>${axisPills}`
      + `<span class="hud-val">${esc(tt.num || '0')}${tt.mode === 'rotate' ? '°' : ''}<span class="hud-cur"></span></span>`
      + `<span class="hud-note">${tt.mode === 'move' ? 'blocks' : 'snaps 90°'} · <kbd>Enter</kbd> apply · <kbd>Esc</kbd> cancel</span>`;
    h.hidden = false;
  } else if (drag) {
    const lbl = drag.plane === 'xz' ? 'XZ PLANE' : AXN[drag.axis].toUpperCase();
    h.innerHTML = `<span class="hud-badge">MOVE ${lbl}</span>`
      + `<span class="hud-val">${drag.dx>=0?'+':''}${drag.dx}, ${drag.dy>=0?'+':''}${drag.dy}, ${drag.dz>=0?'+':''}${drag.dz}</span>`
      + (drag.snapped ? `<span class="hud-snap">Snapped → ${esc(drag.snapped)}</span>` : '')
      + `<span class="hud-note">Outline preview · release to place</span>`;
    h.hidden = false;
  } else if (flying) {
    const pct = Math.round(((S.speed - .2) / 7.8) * 100);
    h.innerHTML = `<span class="hud-badge fly">FLY</span><span><b>WASD</b> move · <b>QE</b> up/dn · <b>Shift</b> 3×</span>`
      + `<span class="speedbar"><i><b style="width:${pct}%"></b></i><b>${S.speed.toFixed(1)}×</b></span>`
      + `<span class="hud-note">Spectator · loading chunks</span>`;
    h.hidden = false;
  } else {
    h.hidden = true;
  }
}
$('#hud').addEventListener('click', e => {
  const b = e.target.closest('[data-ttax]');
  if (b && tt && tt.mode === 'move') { tt.axis = +b.dataset.ttax; drag.base.forEach(([id, p]) => byId[id].pos = [...p]); updateTT(); }
});

/* ---------- Mouse & Keyboard ---------- */
const mouse = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  closeMenu(); closePops();
  const p = mouse(e);
  if (pickingBool && e.button === 0) {
    const hits = pickAll(p);
    const targetId = hits.find(id => id !== pickingBool.id && byId[id]?.type === 'object');
    if (targetId) {
      commit(() => { byId[pickingBool.id].mods[pickingBool.modIndex].target = targetId; }, true);
      toast(`Boolean cutter set to <b>${esc(byId[targetId].name)}</b>`);
    } else toast('Click canceled picker (no object hit)');
    pickingBool = null; cv.classList.remove('eyedrop'); renderProps(); return;
  }
  if (tt) { if (e.button === 0) confirmTT(); else cancelTT(); return; }
  if (e.button === 0) {
    const gh = hitGizmo(p);
    if (gh?.type === 'axis') { pushUndo(); drag = startDrag(); drag.axis = gh.h.axis; drag.start = p; drag.h = gh.h; hud(); draw(); return; }
    if (gh?.type === 'plane') { pushUndo(); drag = startDrag(); drag.plane = 'xz'; drag.start = p; drag.pl = gh.plane; hud(); draw(); return; }
    if (gh?.type === 'ring') { rotateSel(e.shiftKey ? -1 : 1); return; }
    const hits = pickAll(p);
    if (tool === 'box' || (!hits.length && tool === 'select')) { boxSel = { a: p, b: p, add: e.shiftKey }; draw(); return; }
    if (!hits.length) { if (!e.shiftKey) select(null); return; }
    if (e.altKey && sel.length === 1 && hits.includes(sel[0])) { select(hits[(hits.indexOf(sel[0]) + 1) % hits.length]); toast(`Alt+click cycled ${hits.length} overlapping objects`); return; }
    select(hits[0], e.shiftKey);
  } else if (e.button === 1) { e.preventDefault(); orbit = { p, pan: e.shiftKey }; cv.style.cursor = e.shiftKey ? 'move' : 'grabbing'; }
  else if (e.button === 2) { rmb = { p, moved: false, cx: e.clientX, cy: e.clientY }; }
});

addEventListener('mousemove', e => {
  const p = mouse(e);
  if (boxSel) { boxSel.b = p; draw(); return; }
  if (drag) {
    if (drag.plane === 'xz') {
      const dx = p[0]-drag.start[0], dy = p[1]-drag.start[1];
      const ux = (dx*drag.pl.sx.dir[0] + dy*drag.pl.sx.dir[1]) / drag.pl.sx.ppb;
      const uz = (dx*drag.pl.sz.dir[0] + dy*drag.pl.sz.dir[1]) / drag.pl.sz.ppb;
      applyMoveVec([Math.round(ux), 0, Math.round(uz)], true);
    } else {
      const d = (p[0]-drag.start[0])*drag.h.dir[0] + (p[1]-drag.start[1])*drag.h.dir[1];
      const v = [0,0,0]; v[drag.axis] = Math.round(d / drag.h.ppb);
      applyMoveVec(v, true);
    }
    hud(); draw(); drawMap(); return;
  }
  if (orbit) {
    const dx = p[0]-orbit.p[0], dy = p[1]-orbit.p[1]; orbit.p = p;
    if (orbit.pan) { const ca = Math.cos(S.yaw), sa = Math.sin(S.yaw), sp = Math.sin(S.pitch); S.t[0] -= ca*dx/S.zoom + sa*dy/(S.zoom*sp); S.t[2] -= -sa*dx/S.zoom + ca*dy/(S.zoom*sp); }
    else { S.yaw += dx * .008; S.pitch = Math.max(.15, Math.min(1.45, S.pitch + dy * .006)); }
    draw(); drawMap(); return;
  }
  if (rmb) {
    const dx = p[0]-rmb.p[0], dy = p[1]-rmb.p[1];
    if (!rmb.moved && Math.hypot(dx, dy) > 4) { rmb.moved = true; flying = true; cv.style.cursor = 'none'; hud(); flyLoop(); }
    if (rmb.moved) { S.yaw += dx * .006; S.pitch = Math.max(.15, Math.min(1.45, S.pitch + dy * .005)); rmb.p = p; draw(); drawMap(); }
    return;
  }
  if (e.target === cv) {
    const gh = hitGizmo(p);
    const prevRot = rotHover, prevHov = hoverOwner;
    rotHover = gh?.type === 'ring';
    hoverOwner = gh ? null : (pickAll(p)[0] || null);
    if (rotHover !== prevRot || hoverOwner !== prevHov) draw();
  }
});

addEventListener('mouseup', e => {
  if (boxSel && e.button === 0) {
    const x0 = Math.min(boxSel.a[0], boxSel.b[0]), x1 = Math.max(boxSel.a[0], boxSel.b[0]);
    const y0 = Math.min(boxSel.a[1], boxSel.b[1]), y1 = Math.max(boxSel.a[1], boxSel.b[1]);
    if (x1 - x0 > 4 || y1 - y0 > 4) {
      const hitSet = new Set(boxSel.add ? sel : []);
      lastBoxes.forEach(b => {
        const ctr = P([(b.mn[0]+b.mx[0])/2, (b.mn[1]+b.mx[1])/2, (b.mn[2]+b.mx[2])/2]);
        if (ctr[0] >= x0 && ctr[0] <= x1 && ctr[1] >= y0 && ctr[1] <= y1) hitSet.add(b.owner);
      });
      sel = [...hitSet];
    } else if (!boxSel.add) sel = [];
    boxSel = null; renderAll(); return;
  }
  if (drag && e.button === 0) {
    const moved = drag.dx !== 0 || drag.dy !== 0 || drag.dz !== 0;
    if (!moved) undo.pop();
    drag = null; hud(); if (moved) changed(true); else draw();
  }
  if (orbit && e.button === 1) { orbit = null; cv.style.cursor = ''; }
  if (rmb && e.button === 2) {
    if (!rmb.moved) { const hits = pickAll(mouse(e)); if (hits.length && !sel.includes(hits[0])) select(hits[0]); openMenu(rmb.cx, rmb.cy, hits.length ? 'object' : 'empty'); }
    rmb = null; flying = false; cv.style.cursor = ''; hud();
  }
});

cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (flying) { S.speed = Math.max(.2, Math.min(8, S.speed * (e.deltaY < 0 ? 1.2 : 1/1.2))); hud(); return; }
  const f = Math.exp(-e.deltaY * .0012); S.zoom = Math.max(2, Math.min(40, S.zoom * f)); draw(); drawMap();
}, { passive: false });

function flyLoop() {
  if (!flying) return;
  const ca = Math.cos(S.yaw), sa = Math.sin(S.yaw), v = .5 * S.speed * (keys.shift ? 3 : 1);
  let mv = false; const fw = [-sa, 0, -ca], rt = [ca, 0, -sa];
  if (keys.w) { S.t = add(S.t, fw.map(x => x*v)); mv = true; } if (keys.s) { S.t = add(S.t, fw.map(x => -x*v)); mv = true; }
  if (keys.d) { S.t = add(S.t, rt.map(x => x*v)); mv = true; } if (keys.a) { S.t = add(S.t, rt.map(x => -x*v)); mv = true; }
  if (keys.e) { S.t[1] += v; mv = true; } if (keys.q) { S.t[1] -= v; mv = true; }
  if (mv) { draw(); drawMap(); }
  requestAnimationFrame(flyLoop);
}

function confirmTT() {
  const t = tt; tt = null;
  if (t.mode === 'move') {
    const n = parseInt(t.num || '0', 10) || 0;
    if (n === 0) { if (drag) { drag.base.forEach(([id, p]) => byId[id].pos = p); undo.pop(); } drag = null; hud(); draw(); return; }
    drag = null; hud(); changed(true); toast(`Moved ${n} blocks on ${AXN[t.axis].toUpperCase()}`);
  } else {
    hud(); const deg = parseInt(t.num || '0', 10) || 0, steps = Math.round(deg / 90);
    if (steps) rotateSel(steps); else draw();
  }
}
function cancelTT() { if (tt?.mode === 'move' && drag) { drag.base.forEach(([id, p]) => byId[id].pos = p); undo.pop(); } tt = null; drag = null; hud(); draw(); }
function updateTT() { if (tt.mode === 'move') { const v=[0,0,0]; v[tt.axis]=parseInt(tt.num||'0',10)||0; applyMoveVec(v, false); } hud(); draw(); drawMap(); }

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.target.matches('input, select, textarea')) return;
  keys.shift = e.shiftKey;
  if (flying && 'wasdqe'.includes(k) && k.length === 1) { keys[k] = true; e.preventDefault(); return; }
  if (e.key === 'Escape') {
    if (pickingBool) { pickingBool = null; cv.classList.remove('eyedrop'); renderProps(); return; }
    closePops(); if (!$('#ctx').hidden) return closeMenu(); if (tt) return cancelTT();
  }
  if (e.key === 'Tab') { e.preventDefault(); zen = !zen; $('#app').classList.toggle('zen', zen); renderToolbar(); setTimeout(resize, 10); return; }
  if (tt) {
    e.preventDefault();
    if (e.key === 'Enter') return confirmTT();
    if (tt.mode === 'move' && 'xyz'.includes(k) && k.length === 1) { tt.axis = 'xyz'.indexOf(k); drag.base.forEach(([id, p]) => byId[id].pos = [...p]); return updateTT(); }
    if (/^[0-9]$/.test(e.key)) { tt.num += e.key; return updateTT(); }
    if (e.key === '-') { tt.num = tt.num.startsWith('-') ? tt.num.slice(1) : '-' + tt.num; return updateTT(); }
    if (e.key === 'Backspace') { tt.num = tt.num.slice(0, -1); return updateTT(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); return e.shiftKey ? doRedo() : doUndo(); }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); return doRedo(); }
  if ((e.ctrlKey || e.metaKey) && k === 'g') { e.preventDefault(); return act('group'); }
  if (e.ctrlKey || e.metaKey) return;
  if (k === 'a' && e.shiftKey) { e.preventDefault(); return toggleAddPop(); }
  if (k === 'g' && sel.length) { e.preventDefault(); pushUndo(); drag = startDrag(); drag.axis = 0; tt = { mode:'move', axis:0, num:'' }; return updateTT(); }
  if (k === 'r' && sel.length) { e.preventDefault(); tt = { mode:'rotate', num:'' }; hud(); draw(); return; }
  if (k === 'd' && e.shiftKey) { e.preventDefault(); return duplicate(false); }
  if (k === 'd' && e.altKey) { e.preventDefault(); return duplicate(true); }
  if (k === 'h' && e.altKey) { e.preventDefault(); return unhideAll(); }
  if (k === 'h') return hideSel();
  if (k === 'x' || e.key === 'Delete') return delSel();
  if (k === '/') { e.preventDefault(); return toggleLocal(); }
  if (k === '.' || k === 'f') return frameSel();
  if (k === 'w') { tool = 'select'; return renderAll(); }
  if (k === 'b') { tool = 'box'; return renderAll(); }
  if (k === 'm') return mirrorSel(false);
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys[k] = false; keys.shift = e.shiftKey; });

/* ---------- Submenu-based Context Menu ---------- */
const menu = $('#ctx');
function closeMenu() { menu.hidden = true; menu.innerHTML = ''; }
addEventListener('mousedown', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); }, true);

function mi(a, icon, label, key, opt = {}) {
  return `<div class="mitem"><button class="mbtn ${opt.cls||''}" role="menuitem" data-act="${a}" ${opt.dis?'disabled':''}>${ic(icon)}<span class="l">${label}</span>${key?`<kbd>${key}</kbd>`:''}</button></div>`;
}
function msub(icon, label, itemsHtml, extraRight = '') {
  return `<div class="mitem has-sub"><button class="mbtn" type="button" aria-haspopup="true">${ic(icon)}<span class="l">${label}</span>${extraRight}<span style="color:var(--dim);font-size:11px">▸</span></button><div class="submenu" role="menu">${itemsHtml}</div></div>`;
}

function openMenu(x, y, kind) {
  const n = byId[sel[0]]; let h = '';
  if (kind === 'empty' || !n) {

          mi('add-schem', 'object', 'Schematic…', 'Shift+A')
        + mi('add-asm', 'assembly', 'Assembly…')
        + mi('link-proj', 'link', 'Link project as assembly…')
        + mi('add-area', 'area', 'Heavymatica dig area'))
      + '<hr>' + mi('frame', 'frame', 'Frame all', 'F') + mi('unhide', 'eye', 'Show all hidden', 'Alt+H');
  } else if (n.type === 'project') {
    h = `<div class="mh">${esc(n.name)} · Project</div>`
      + mi('set-active', 'object', 'Make active project', '', { dis: n.active })
      + mi('new-folder', 'folder', 'New folder')
      + mi('add-schem', 'plus', 'Add schematic…', 'Shift+A')
      + '<hr>'
      + msub('export', 'Share & Export', mi('push', 'sync', 'Push to Syncmatica') + mi('link-into', 'link', 'Link into active project', '', { dis: n.active }) + mi('export-proj', 'export', 'Export project (.zip)'))
      + '<hr>' + mi('close-proj', 'close', 'Close project');
  } else if (n.type === 'folder' || n.type === 'loose') {
    h = `<div class="mh">${esc(n.name)}</div>`
      + mi('new-folder', 'folder', 'New folder')
      + mi('to-proj', 'project', 'Convert to project')
      + mi('group', 'group', 'Create assembly from folder', 'Ctrl+G')
      + mi('hide', 'eyeoff', n.hidden ? 'Show' : 'Hide', 'H')
      + '<hr>' + mi('export-folder', 'export', 'Export folder (.zip)');
  } else {
    const am = arrayMod(n), bm = boolMod(n), isAsm = n.type === 'assembly', many = sel.length > 1;
    h = `<div class="mh">${many ? sel.length + ' objects selected' : esc(n.name)}</div>`
      + mi('dup', 'dup', 'Duplicate', 'Shift+D')
      + mi('ldup', 'link', 'Linked duplicate', 'Alt+D')
      + msub('move', 'Transform',
          mi('tool-move', 'move', 'Move', 'G')
        + mi('rot-cw', 'rotate', 'Rotate +90°', 'R')
        + mi('rot-ccw', 'rotate', 'Rotate −90°', 'Shift+R')
        + mi('mirror', 'mirror', 'Mirror X', 'M')
        + mi('mirror-z', 'mirror', 'Mirror Z (X + 180°)'))
      + (n.type !== 'area' ? msub('array', 'Modifiers',
          mi('add-array', 'array', 'Add Array modifier', '', { dis: !!am })
        + mi('add-bool', 'bool', 'Add Boolean modifier')
        + (am || bm ? '<hr>' : '')
        + (am ? mi('realise', 'array', `Realise array (${am.count} objects)`) : '')
        + (bm ? mi('apply-bool', 'bool', 'Apply Boolean → .litematic') : '')) : '')
      + (n.type !== 'area' && !n.wire ? msub('front', 'Front order',
          mi('front', 'front', 'Bring to front (P1)')
        + mi('fwd', 'front', 'Bring forward')
        + mi('bwd', 'back', 'Send backward')
        + mi('back', 'back', 'Send to back'), `<span class="bdg">P${n.prio??5}</span>`) : '')
      + msub('assembly', 'Assembly',
          mi('group', 'group', 'Create from selection', 'Ctrl+G')
        + (isAsm ? mi('breakup', 'explode', 'Break up in place') + mi('make-local', 'link', 'Make local (copy files)', '', { dis: !n.linked }) : ''))
      + msub('eye', 'View & Visibility',
          mi('hide', 'eyeoff', n.hidden ? 'Show' : 'Hide', 'H')
        + mi('local', 'local', 'Local view', '/')
        + mi('frame', 'frame', 'Frame selected', '.')
        + mi('unhide', 'eye', 'Show all hidden', 'Alt+H'))
      + msub('export', 'Share & Export',
          mi('push', 'sync', 'Push to Syncmatica')
        + mi('export', 'export', isAsm ? 'Export assembly (.zip)' : 'Export as .litematic')
        + (isAsm ? mi('bake', 'export', 'Bake to one .litematic') : ''))
      + '<hr>' + mi('delete', 'trash', 'Delete', 'X', { cls: 'danger' });
  }
  menu.innerHTML = h; menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menu.querySelectorAll('.submenu').forEach(sm => {
    const mr = menu.getBoundingClientRect();
    if (mr.right + 230 > innerWidth) sm.classList.add('flip-left');

}

menu.addEventListener('mouseover', e => {
  const item = e.target.closest('.mitem'); if (!item || !menu.contains(item)) return;
  if (item.parentElement === menu) {
    menu.querySelectorAll('.mitem.has-sub.open').forEach(o => { if (o !== item) o.classList.remove('open'); });
    if (item.classList.contains('has-sub')) item.classList.add('open');
  }
});
menu.addEventListener('click', e => {
  const subBtn = e.target.closest('.mitem.has-sub > .mbtn');
  if (subBtn) { const it = subBtn.parentElement; it.classList.toggle('open'); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  closeMenu(); act(b.dataset.act);
});

function act(a) {
  const id = sel[0], n = byId[id];
  switch (a) {
    case 'dup': return duplicate(false);
    case 'ldup': return duplicate(true);
    case 'tool-move': tool = 'move'; return renderAll();
    case 'rot-cw': return rotateSel(1);
    case 'rot-ccw': return rotateSel(-1);
    case 'mirror': return mirrorSel(false);
    case 'mirror-z': return mirrorSel(true);
    case 'add-array': return addMod(id, 'array');
    case 'add-bool': return addMod(id, 'boolean');
    case 'realise': return realise(id);
    case 'apply-bool': { const bi = (n.mods||[]).findIndex(m => m.type === 'boolean'); if (bi >= 0) applyBool(id, bi); return; }
    case 'breakup': return breakUp(id);
    case 'make-local': commit(() => { n.linked = null; }); return toast(`Made <b>${esc(n.name)}</b> local`);
    case 'group': return toast('Created assembly (.lasm) from selection in active project');
    case 'to-proj': return convertLooseToProject(id);
    case 'front': case 'back': case 'fwd': case 'bwd': setPrio(id, { front:'front', back:'back', fwd:'up', bwd:'down' }[a]); return toast(`Front order: <b>${esc(n.name)}</b> is now P${byId[id].prio}`);
    case 'hide': return hideSel();
    case 'unhide': return unhideAll();
    case 'local': return toggleLocal();
    case 'frame': return frameSel();
    case 'delete': return delSel();
    case 'set-active': tree.forEach(p => { if (p.type === 'project') p.active = p === n; }); renderAll(); return toast(`Active project: <b>${esc(n.name)}</b>`);
    case 'push': pendingSync = 0; renderAll(); return toast('Pushed flat placements + project manifest to Syncmatica');
    case 'export': return toast(`Exported <b>${esc(n.name)}</b> to schematics/exports/`);
    case 'bake': return toast(`Baked <b>${esc(n.name)}</b> into a single .litematic`);
    case 'add-schem': return addQuickNode('object');
    case 'add-asm': return addQuickNode('assembly');
    case 'add-area': return addQuickNode('area');
    default: return toast('Opens picker / file dialog in the mod');
  }
}

function addQuickNode(kind) {
  const proj = activeProject(); if (!proj) return;
  const count = (proj.children||[]).length + 1;
  let node;
  if (kind === 'object') node = N({ type:'object', name:`new_module_${count}`, file:`files/new_module_${count}.litematic`, pos:[10,0,10], size:[8,6,8], color:'#7fa6c4', prio:6, fill:.45, mods:[] });
  else if (kind === 'area') node = N({ type:'area', name:`Dig · Zone ${count}`, source:'Heavymatica', pos:[8,-1,8], size:[16,8,16], color:'#f2b35e' });
  else node = N({ type:'assembly', name:`Assembly ${count}`, linked:`files/assembly_${count}.lasm`, pos:[14,0,12], prio:6, open:false, children:[
    { type:'object', name:'part_a', file:'part_a.litematic', pos:[0,0,0], size:[8,4,8], color:'#9fb4c9', fill:.5 }
  ]});
  commit(() => { proj.open = true; proj.children.push(node); sel = [node.id]; }, true);
  toast(`Added <b>${esc(node.name)}</b> to <b>${esc(proj.name)}</b>`);
}

/* ---------- Popovers (+ Add & ? Guide) ---------- */
function closePops() { $('#pop-add').hidden = true; $('#pop-guide').hidden = true; }
function toggleAddPop() {
  const p = $('#pop-add'), was = !p.hidden; closePops(); if (was) return;

/* ---------- Scene Graph (3-zone fixed-rail rows + Overlaps view) ---------- */
const FILTERS = [['all','All'], ['object','Schematics'], ['assembly','Assemblies'], ['area','Areas'], ['overlaps','Overlaps']];
function renderFilters() {
  $('#filters').innerHTML = FILTERS.map(([k, l]) => `<button class="chipb ${k==='overlaps'?'warn':''} ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; renderFilters(); renderTree(); } });
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderTree(); });

function matches(n) {
  const self = (filter === 'all' || n.type === filter) && (!query || n.name.toLowerCase().includes(query));
  return self || (n.children||[]).some(matches);
}

function renderTree() {
  const trims = {}, involved = new Set();
  lastOverlaps.forEach(o => { trims[o.back] = (trims[o.back] || 0) + o.vol; involved.add(o.front); involved.add(o.back); });
  const rows = [];

  const emitRow = (n, depth, locked, hiddenUp) => {
    const kids = n.children && n.children.length, open = n.open || query || (filter !== 'all' && filter !== 'overlaps');
    const owner = ownerOf(n.id), isSel = sel.includes(n.id), ownSel = !isSel && sel.includes(owner) && owner !== n.id;
    const hid = n.hidden || hiddenUp, am = arrayMod(n), bm = boolMod(n);

    // Zone 2: Max 2 compact tokens + explicit red trim warning
    let meta = '';
    if (n.type === 'project') {
      if (n.active) meta += '<span class="bdg act">ACTIVE</span>';
      meta += `<span class="sdot" title="${n.sync==='shared'?'Shared on Syncmatica':'Local only'}" style="background:${n.sync==='shared'?'var(--ok)':'var(--gutter)'}"></span>`;
    } else {
      if (n.linked || n.linkOf) meta += `<span class="bdg lnk" title="Linked: ${esc(n.linked || n.linkOf)}">${ic('link')}</span>`;
      if (am || bm) {
        const txt = (am ? `×${am.count}` : '') + (am && bm ? '·' : '') + (bm ? '◐' : '');
        meta += `<span class="bdg mod" title="${am?'Array ×'+am.count+' ':''}${bm?'Boolean '+bm.op:''}">${txt}</span>`;
      }
      if (trims[n.id]) meta += `<span class="bdg trim" title="Losing ${fmt(trims[n.id])} overlapping blocks">−${fmt(trims[n.id])}</span>`;
    }

    // Zone 3: Fixed P# rail + Eye
    let rail = '';
    if (n.prio != null && !locked && hasTransform(n) && !n.wire && n.type !== 'area') {
      rail += `<button class="prio-btn ${involved.has(n.id)?'hot':''}" data-act="prio" title="Front order (P1 = front). Click to bring forward.">P${n.prio}</button>`;
    }
    if (n.type !== 'loose') {
      rail += `<button class="eye" data-act="eye" aria-label="${n.hidden?'Show':'Hide'}">${ic(n.hidden?'eyeoff':'eye')}</button>`;
    }

    const icon = n.type === 'object' && n.wire ? 'bool' : n.type;
    rows.push(`<div class="row ${n.type==='project'||n.type==='loose'?'proj':''} ${isSel?'sel':''} ${ownSel?'owner-sel':''} ${hid?'hid':''} ${locked?'locked':''}" role="treeitem" aria-selected="${isSel}" data-id="${n.id}">
      <div class="row-main" style="padding-left:${4 + depth*12}px">
        ${kids && filter !== 'overlaps' ? `<button class="tw ${open?'open':''}" data-act="tw" aria-label="Toggle">${ic('chev')}</button>` : '<span class="tw"></span>'}
        ${ic(icon, 'ty t-' + n.type)}
        <span class="nm" title="${esc(n.file || n.path || n.name)}">${esc(n.name)}</span>
      </div>
      <div class="row-meta">${meta}</div>
      <div class="row-rail">${rail}</div>
    </div>`);

    if (kids && open && filter !== 'overlaps') {
      n.children.forEach(c => emitRow(c, depth + 1, locked || (n.type === 'assembly' && !!n.linked), hid));
    }
  };

  if (filter === 'overlaps') {
    const ordered = Object.values(byId).filter(n => involved.has(n.id) && ownerOf(n.id) === n.id && (!query || n.name.toLowerCase().includes(query)))
      .sort((a,b) => (a.prio??5) - (b.prio??5));
    ordered.forEach(n => emitRow(n, 0, false, false));
    $('#tree').innerHTML = rows.join('') || '<div class="empty" style="padding:18px 6px;color:var(--dim);text-align:center">No overlapping objects right now.</div>';
    return;
  }

  tree.forEach(n => {
    if ((query || filter !== 'all') && !matches(n)) return;
    emitRow(n, 0, false, false);
  });
  $('#tree').innerHTML = rows.join('') || '<div class="empty" style="padding:18px 6px;color:var(--dim);text-align:center">Nothing matches this filter.</div>';
}

$('#tree').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return; const id = r.dataset.id, n = byId[id];
  const b = e.target.closest('[data-act]');
  if (b?.dataset.act === 'tw') { n.open = !n.open; return renderTree(); }
  if (b?.dataset.act === 'eye') { commit(() => n.hidden = !n.hidden); return; }
  if (b?.dataset.act === 'prio') { setPrio(id, 'up'); toast(`Moved <b>${esc(n.name)}</b> forward to P${byId[id].prio}`); return; }
  if (n.type === 'project' || n.type === 'folder' || n.type === 'loose') { sel = e.shiftKey ? [...sel, id] : [id]; return renderAll(); }
  select(id, e.shiftKey);
});

}

    const blocks = objs.reduce((s, o) => s + blocksOf(o.id, lastBoxes), 0);

      <div class="sec"><h4>Project</h4>
        <div class="kv"><span>World</span><b>${esc(n.world)}</b></div>
        <div class="kv"><span>Syncmatica</span><b style="color:${n.sync==='shared'?'var(--ok)':'var(--dim)'}">${n.sync==='shared'?'Shared':'Local only'}</b></div>
        <div class="rowbtns">${n.active?'<span class="btn ghost wide" style="color:var(--accent)">Active project</span>':'<button class="btn wide" data-a="set-active">Make active</button>'}<button class="btn wide" data-a="export-proj">${ic('export')}Export .zip</button></div>

  if (n.type === 'folder' || n.type === 'loose') {

      </div>`;

  const trimmed = lastOverlaps.filter(o => o.back === n.id), wins = lastOverlaps.filter(o => o.front === n.id);
  const blocks = blocksOf(n.id, lastBoxes), cut = trimmed.reduce((s, o) => s + o.vol, 0);
  const am = arrayMod(n);

  const head = `<div class="ph">${ic(n.wire?'bool':n.type, 'ty t-'+n.type)}<input value="${esc(n.name)}" data-k="name" aria-label="Name"></div>

  const xf = `<div class="sec"><h4>Transform</h4>

  let out = '';

      <p class="note warnc">Areas never affect schematic blocks, Booleans, or front order.</p></div>`;
  } else if (n.wire) {
    out = `<div class="sec"><h4>Cutter Object</h4><p class="note">Drawn as wireframe because a Boolean modifier targets it. Excluded from block counts and printing.</p></div>`;
  } else {
    out = `<div class="sec"><h4>Blocks</h4>
        <div class="stat"><div><span class="bignum">${fmt(blocks - cut)}</span><small>counted</small></div>${cut?`<div><span class="bignum" style="color:var(--err)">−${fmt(cut)}</span><small>trimmed</small></div>`:''}</div>
      </div>
      <div class="sec"><h4>Front order <span class="sp"></span><span class="bdg">P${n.prio??'–'}</span></h4>

        ${trimmed.map(o=>`<p class="note err">Loses ${fmt(o.vol)} blocks to <b>${esc(byId[o.front].name)}</b> (P${byId[o.front].prio}).</p>`).join('')}

      </div>
      <div class="sec"><h4>Modifiers</h4>
        ${(n.mods||[]).map((m, i) => {
          const offCls = m.enabled === false ? 'off' : '';
          const colCls = m.collapsed ? 'collapsed' : '';
          if (m.type === 'array') {
            const s = localSize(n), span = m.mode==='blk' ? [s[0]+Math.abs(m.off[0])*(m.count-1), s[1]+Math.abs(m.off[1])*(m.count-1), s[2]+Math.abs(m.off[2])*(m.count-1)] : [s[0]*Math.max(1,m.count*(Math.abs(m.off[0])||1)), s[1], s[2]];
            return `<div class="mod m-array ${offCls} ${colCls}">

          return `<div class="mod m-bool ${offCls} ${colCls}">

              <button class="hb" data-mmv="${i}:-1" title="Move up">↑</button>
              <button class="hb" data-rm="${i}" title="Remove">${ic('close')}</button>
            </div>
            <div class="mod-b">
              <div class="fr"><span>Operation</span><select class="selc" data-mod="${i}" data-mk="op"><option ${m.op==='Difference'?'selected':''}>Difference</option><option ${m.op==='Intersect'?'selected':''}>Intersect</option></select></div>
              <div class="fr"><span>Object</span><div class="rowbtns" style="flex-wrap:nowrap"><select class="selc" data-mod="${i}" data-mk="target">${Object.values(byId).filter(o=>o.type==='object'&&o.id!==n.id).map(o=>`<option value="${o.id}" ${m.target===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select><button class="btn ${picking?'pri':''}" data-pick="${i}" title="Click an object in the 3D world to set as cutter">${ic('dropper')}</button></div></div>
              <button class="btn pri" data-apply="${i}">Apply → new .litematic</button>
            </div></div>`;
        }).join('')}
        <div class="rowbtns"><button class="btn wide" data-a="add-array" ${am?'disabled':''}>${ic('plus')}Array</button><button class="btn wide" data-a="add-bool">${ic('plus')}Boolean</button></div>
      </div>`;
  }
  el.innerHTML = head + xf + out;
}

    commit(() => { if (mk === 'count') m.count = Math.max(1, Math.min(1024, parseInt(t.value, 10) || 1)); else if (mk.startsWith('off')) m.off[+mk[3]] = parseFloat(t.value) || 0; else m[mk] = t.value; }, true);

  if (b.dataset.mmode != null) { const [i, md] = b.dataset.mmode.split(':'); commit(() => n.mods[+i].mode = md, true); return; }
  if (b.dataset.pick != null) { const idx = +b.dataset.pick; pickingBool = (pickingBool?.modIndex === idx) ? null : { id: n.id, modIndex: idx }; cv.classList.toggle('eyedrop', !!pickingBool); renderProps(); if (pickingBool) toast('Click any object in the viewport to pick Boolean cutter'); return; }
  if (b.dataset.rm != null) { commit(() => n.mods.splice(+b.dataset.rm, 1), true); return; }
  if (b.dataset.apply != null) return applyBool(n.id, +b.dataset.apply);
  if (b.dataset.a) act(b.dataset.a);
});

/* ---------- Collapsible / Resizable Top View ---------- */
$('#map-toggle').addEventListener('click', () => {
  const mp = $('#map-pane'); mp.classList.toggle('collapsed');
  $('#map-chev').textContent = mp.classList.contains('collapsed') ? '▸' : '▾';
  if (!mp.classList.contains('collapsed')) drawMap();
});
$('#splitter').addEventListener('mousedown', e => {
  const y0 = e.clientY, h0 = $('#map').getBoundingClientRect().height;
  const mv = ev => { const nh = Math.max(90, Math.min(360, h0 + (y0 - ev.clientY))); $('#map').style.height = nh + 'px'; drawMap(); };
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up); e.preventDefault();
});

const mc = $('#map'), mg = mc.getContext('2d'); let mapXf = null;
function drawMap() {
  if ($('#map-pane').classList.contains('collapsed')) return;
  const r = mc.getBoundingClientRect(); if (!r.width) return;
  mc.width = r.width * DPR; mc.height = r.height * DPR; mg.setTransform(DPR, 0, 0, DPR, 0, 0);
  mg.fillStyle = '#0b0d10'; mg.fillRect(0, 0, r.width, r.height);
  const all = lastBoxes; if (!all.length) return;
  const [mn, mx] = aabb(all.flatMap(b => [b.mn, b.mx]));
  const pad = 10, sc = Math.min((r.width - pad*2) / (mx[0]-mn[0] + 8), (r.height - pad*2) / (mx[2]-mn[2] + 8));
  const ox = pad + ((r.width - pad*2) - (mx[0]-mn[0])*sc) / 2 - mn[0]*sc, oz = pad + ((r.height - pad*2) - (mx[2]-mn[2])*sc) / 2 - mn[2]*sc;
  mapXf = { sc, ox, oz };
  mg.strokeStyle = '#ffffff0a'; mg.lineWidth = 1;
  for (let x = Math.ceil(mn[0]/16)*16; x <= mx[0]; x += 16) { mg.beginPath(); mg.moveTo(ox + x*sc, 0); mg.lineTo(ox + x*sc, r.height); mg.stroke(); }
  for (let z = Math.ceil(mn[2]/16)*16; z <= mx[2]; z += 16) { mg.beginPath(); mg.moveTo(0, oz + z*sc); mg.lineTo(r.width, oz + z*sc); mg.stroke(); }
  const rect = b => [ox + b.mn[0]*sc, oz + b.mn[2]*sc, (b.mx[0]-b.mn[0])*sc, (b.mx[2]-b.mn[2])*sc];
  all.filter(b => b.kind === 'area').forEach(b => { mg.setLineDash([4, 3]); mg.strokeStyle = sel.includes(b.owner) ? '#5ec4b6' : '#f2b35ecc'; mg.strokeRect(...rect(b)); mg.setLineDash([]); });
  all.filter(b => b.kind === 'solid').sort((a, b) => a.mx[1] - b.mx[1]).forEach(b => { mg.fillStyle = sel.includes(b.owner) ? (b.copy ? '#5ec4b699' : '#5ec4b6') : shade(b.node.color, b.copy ? .7 : .9); mg.fillRect(...rect(b)); mg.strokeStyle = '#0008'; mg.strokeRect(...rect(b)); });
  all.filter(b => b.kind === 'wire').forEach(b => { mg.setLineDash([2, 2]); mg.strokeStyle = '#b48cf0'; mg.strokeRect(...rect(b)); mg.setLineDash([]); });
  lastOverlaps.forEach(o => { mg.fillStyle = '#f07470'; mg.fillRect(...rect(o)); });
  const cx0 = ox + S.t[0]*sc, cz0 = oz + S.t[2]*sc, sa = Math.sin(S.yaw), ca = Math.cos(S.yaw), d = 24;
  const camx = cx0 + sa*d, camz = cz0 + ca*d, lx = -sa, lz = -ca;
  mg.fillStyle = '#e2e5e922'; mg.beginPath(); mg.moveTo(camx, camz);
  mg.lineTo(camx + (lx*Math.cos(.5) - lz*Math.sin(.5))*38, camz + (lx*Math.sin(.5) + lz*Math.cos(.5))*38);
  mg.lineTo(camx + (lx*Math.cos(-.5) - lz*Math.sin(-.5))*38, camz + (lx*Math.sin(-.5) + lz*Math.cos(-.5))*38); mg.closePath(); mg.fill();
  mg.fillStyle = '#e2e5e9'; mg.beginPath(); mg.arc(camx, camz, 3.5, 0, 7); mg.fill();
  mg.strokeStyle = '#e2e5e955'; mg.beginPath(); mg.arc(cx0, cz0, 3, 0, 7); mg.stroke();
}
mc.addEventListener('click', e => {
  if (!mapXf) return; const r = mc.getBoundingClientRect(), x = (e.clientX - r.left - mapXf.ox) / mapXf.sc, z = (e.clientY - r.top - mapXf.oz) / mapXf.sc;
  const hit = [...lastBoxes].reverse().find(b => b.kind === 'solid' && x >= b.mn[0] && x <= b.mx[0] && z >= b.mn[2] && z <= b.mx[2]) || lastBoxes.find(b => b.kind === 'area' && x >= b.mn[0] && x <= b.mx[0] && z >= b.mn[2] && z <= b.mx[2]);
  if (hit) select(hit.owner, e.shiftKey); else { S.t[0] = x; S.t[2] = z; draw(); drawMap(); toast('Camera moved to clicked spot'); }
});

/* ---------- Toolbar & Contextual Status Bar ---------- */
function renderToolbar() {
  const t = (k, icon, label, key) => `<button class="tb ${tool===k?'on':''}" data-tool="${k}" aria-pressed="${tool===k}" title="${label} (${key})">${ic(icon)}<span class="lbl">${label}</span><kbd>${key}</kbd></button>`;
  $('#toolbar').innerHTML = `
    <span class="tgroup">
      <span class="mode">Editor <kbd>F6</kbd></span>
      <button class="tb pri" data-b="add" title="Add schematic, assembly, or dig area (Shift+A)">${ic('plus')}<span class="lbl">Add</span></button>
    </span><span class="sep"></span>
    <span class="tgroup">
      ${t('select','cursor','Select','W')}${t('box','box','Box','B')}${t('move','move','Move','G')}${t('rotate','rotate','Rotate','R')}
      <button class="tb" data-b="mirror" title="Mirror X (M)">${ic('mirror')}</button>
    </span><span class="sep"></span>
    <span class="tgroup">
      <button class="tb ${snapOn?'on':''}" data-b="snap" title="Snap to neighbor faces">${ic('magnet')}<span class="lbl">Snap</span></button>
      <select class="tsel" id="pivot" aria-label="Pivot">${['Median','Active object','Bounding box'].map(p=>`<option ${p===pivot?'selected':''}>${p}</option>`).join('')}</select>
      <button class="tb ${localView?'on':''}" data-b="local" title="Local view (/)">${ic('local')}</button>
      <button class="tb ${!zen?'on':''}" data-b="zen" title="Toggle side panels (Tab)">${ic('panels')}</button>
    </span><span class="sep"></span>
    <span class="tgroup">
      <button class="tb" data-b="undo" title="Undo (Ctrl+Z)" ${undo.length?'':'style="opacity:.4"'}>${ic('undo')}</button>
      <button class="tb" data-b="redo" title="Redo (Ctrl+Shift+Z)" ${redo.length?'':'style="opacity:.4"'}>${ic('redo')}</button>
      <button class="tb push ${pendingSync?'':'clean'}" data-b="push" title="Push shared projects to Syncmatica">${ic('sync')}<span class="lbl">Push</span><span class="n">${pendingSync}</span></button>
      <button class="tb" data-b="guide" title="Litematica to Array 2.0 Quick Guide">?</button>
    </span>`;
}
$('#toolbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tool) { tool = b.dataset.tool; return renderAll(); }
  ({
    add: toggleAddPop,
    mirror: () => mirrorSel(false),
    snap: () => { snapOn = !snapOn; renderToolbar(); },
    local: toggleLocal,
    zen: () => { zen = !zen; $('#app').classList.toggle('zen', zen); renderToolbar(); setTimeout(resize, 10); },
    undo: doUndo, redo: doRedo,
    push: () => act('push'),
    guide: toggleGuidePop,
  })[b.dataset.b]?.();
});
$('#toolbar').addEventListener('change', e => { if (e.target.id === 'pivot') { pivot = e.target.value; renderProps(); } });

function renderStatus() {
  const busy = performance.now() < regenUntil;
  const n = byId[sel[0]];
  let hints = `<span><kbd>Click</kbd> select</span><span><kbd>B</kbd> box</span><span><kbd>MMB</kbd> orbit</span><span><kbd>Hold RMB</kbd> fly</span><span><kbd>RMB</kbd> menu</span>`;
  if (sel.length > 1) hints = `<span><kbd>G</kbd> move group</span><span><kbd>R</kbd> rotate</span><span><kbd>Ctrl+G</kbd> assembly</span><span><kbd>H</kbd> hide</span>`;
  else if (n && hasTransform(n)) hints = `<span><kbd>G</kbd> move</span><span><kbd>R</kbd> rotate</span><span><kbd>M</kbd> mirror</span><span><kbd>Shift+D</kbd> dup</span><span><kbd>/</kbd> local</span><span><kbd>Alt+Click</kbd> cycle</span>`;

  const selTxt = !sel.length ? 'No selection' : sel.length > 1 ? `${sel.length} objects` : n ? `${n.name}${n.pos ? ` (${n.pos.join(', ')})` : ''}` : '';
  $('#status').innerHTML = `<div class="hints">${hints}</div>
    <div class="rt">
      <span style="color:var(--fg)">${esc(selTxt)}</span>
      <span>${busy ? `<i class="spin"></i>Rebuilding ${regenCount}…` : `<span class="sdot" style="background:var(--ok)"></span>Cache ready`}</span>
      <span><span class="sdot" style="background:${pendingSync?'var(--warn)':'var(--ok)'}"></span>Syncmatica: ${pendingSync ? pendingSync + ' pending' : 'synced'}</span>
    </div>`;
}

function renderAll() { reindex(); draw(); renderTree(); renderProps(); renderToolbar(); renderStatus(); drawMap(); }
function toast(html) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; $('#toasts').append(t); setTimeout(() => t.remove(), 3500); while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove(); }

reindex(); renderFilters(); sel = [tree[0].children[0].children[0].id]; renderAll();
</script>
