<meta charset="utf-8">
<title>Litematica Array Editor v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mockup v2 of the Litematica Array 2.0 editor. The game viewport fills the frame; ImGui-style windows float over it.
   Single dark look on purpose: it mocks an in-game UI. Drawn at ~0.87x of the DESIGN.md px values (13px body text vs 15px). */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@600&display=swap");
:root {
  --bg: #131518; --vp: #0e1013; --panel: #191c20; --panel2: #1e2126; --line: #2a2e35; --line2: #22262b;
  --fg: #e2e5e9; --dim: #858c96; --dimsel: #a8afb8; --gutter: #4f565f; --slot: #1c1f24;
  --accent: #5ec4b6; --on-accent: #06221e; --sel: #21403b;
  --ok: #8ad27e; --warn: #f2b35e; --err: #f07470; --bool: #b48cf0; --link: #7fc8f0; --area: #f2b35e;
  --t-folder: #c9b27a; --t-object: #9fb4c9;
  --ax-x: #f0605e; --ax-y: #8ad27e; --ax-z: #5b9cf0;
  --btn: #23272d; --chip: #262a31; --track: #2a2f36;
  --f-ui: "Inter", system-ui, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-num: "Barlow Condensed", "Inter", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 13px/1.4 var(--f-ui);
  box-sizing: border-box; padding-block: 16px; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { position: relative; height: 100%; min-height: 560px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--vp); user-select: none; }
#stage { position: absolute; inset: 0; }
#vp { position: absolute; inset: 0; display: block; cursor: default; width: 100%; height: 100%; }
#vp.cross { cursor: crosshair; } #vp.hand { cursor: pointer; } #vp.ew { cursor: ew-resize; } #vp.ns { cursor: ns-resize; } #vp.all { cursor: move; } #vp.none { cursor: none; }

.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 500 10.5px var(--f-mono); padding: 1px 5px; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }

/* toolbar */
#toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; z-index: 30; max-width: calc(100% - 20px); }
.mode { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 28px; border-radius: 5px; background: var(--sel); color: var(--accent); font-weight: 600; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; border: 0; }
.tb { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: var(--dim); white-space: nowrap; flex: none; }
.tb:hover:not(:disabled) { background: var(--btn); color: var(--fg); }
.tb.on { background: var(--btn); color: var(--accent); box-shadow: inset 0 0 0 1px #5ec4b655; }
.tb:disabled { color: var(--gutter); }
.tb .lbl { font-size: 12px; }
.tb.add { color: var(--fg); background: var(--btn); }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; flex: none; }
.tb.push { color: var(--fg); background: var(--btn); }
.pill { border-radius: 9px; padding: 0 6px; font: 600 11px var(--f-mono); }
.tb.push .pill { background: var(--warn); color: #2a1a02; }
.tb.push.clean .pill { background: var(--chip); color: var(--dim); }
select.tsel { height: 28px; border: 0; border-radius: 5px; background: var(--btn); color: var(--fg); padding: 0 6px; font-size: 12px; }
#tb-more { display: none; }
@media (max-width: 1180px) { #toolbar .lbl { display: none; } }
@media (max-width: 1000px) { #toolbar kbd { display: none; } }
@media (max-width: 760px) { .tb-opt { display: none !important; } #tb-more { display: flex; } }
@media (max-width: 480px) { .tb-opt2 { display: none !important; } #toolbar { gap: 2px; } #toolbar .tb { padding: 0 6px; } }

/* HUD */
#hud { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 15px; background: #14161ad1; border: 1px solid #ffffff1a; font: 500 12.5px var(--f-mono); white-space: nowrap; pointer-events: none; max-width: calc(100% - 20px); overflow: hidden; }
#hud b { color: var(--accent); font-weight: 500; }
#hud .d { color: var(--dim); }
.ax-x { color: var(--ax-x); } .ax-y { color: var(--ax-y); } .ax-z { color: var(--ax-z); }
.chips { display: inline-flex; gap: 3px; }
.chip-ax { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; background: var(--chip); color: var(--dim); font: 600 10.5px var(--f-mono); pointer-events: auto; cursor: pointer; border: 0; padding: 0; }
.chip-ax.on.x { background: #f0605e40; color: var(--ax-x); } .chip-ax.on.y { background: #8ad27e40; color: var(--ax-y); } .chip-ax.on.z { background: #5b9cf040; color: var(--ax-z); }
#hud .cur { background: var(--fg); width: 2px; height: 14px; display: inline-block; animation: blink 1s steps(2) infinite; }
.spd { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: #ffffff24; position: relative; overflow: hidden; }
.spd i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
@keyframes blink { 50% { opacity: 0; } }

/* windows */
.win { position: absolute; z-index: 20; display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 32px #0009; max-height: calc(100% - 70px); }
.win:focus-within { border-color: var(--gutter); }
.win[hidden], #stage.nowin ~ .win { display: none; }
.win-h { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 10px; background: var(--panel2); border-bottom: 1px solid var(--line2); border-radius: 8px 8px 0 0; cursor: grab; flex: none; }
.win-h:active { cursor: grabbing; }
.win-h .t { font-weight: 600; font-size: 12.5px; flex: 1; }
.hb { border: 0; background: transparent; color: var(--dim); border-radius: 4px; height: 22px; width: 22px; display: grid; place-items: center; padding: 0; flex: none; }
.hb:hover { background: var(--btn); color: var(--fg); }
.hb[hidden] { display: none; }
.hb.on { color: var(--accent); }
.win-b { padding: 8px 10px; overflow: auto; min-height: 0; }
.win-f { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line2); flex: none; }

/* scene graph */
.search { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 8px; border-radius: 5px; background: var(--btn); border: 1px solid var(--line); color: var(--dim); margin-bottom: 6px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--fg); font-size: 12.5px; }
.search .hb { width: 18px; height: 18px; }
.filters { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.chipb { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 11px; height: 21px; padding: 0 9px; font-size: 11.5px; }
.chipb:hover { color: var(--fg); }
.chipb.on { background: var(--sel); color: var(--accent); border-color: #5ec4b655; }
.chipb.iss { color: var(--err); border-color: #f0747055; }
.chipb.iss.on { background: #f0747022; }
.tree { display: flex; flex-direction: column; position: relative; }
.row { position: relative; display: flex; align-items: center; gap: 5px; height: 22px; padding-right: 2px; border-radius: 4px; font-size: 12.5px; cursor: default; white-space: nowrap; }
.row:hover { background: #ffffff08; }
.row.sel { background: #21403b99; }
.row.sel.active { background: var(--sel); }
.row.sel.active::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--accent); }
.row.sel .nm { color: #fff; } .row.sel .bdg, .row.sel .eye, .row.sel .proj-of { color: var(--dimsel); }
.row.owner-sel { background: #21403b59; }
.row.hid .nm, .row.hid .ty { opacity: .45; }
.row.locked .nm { color: var(--dim); } .row.locked .ty { color: var(--gutter) !important; }
.row.anc .nm { color: var(--dim); }
.row .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--gutter); border: 0; background: transparent; padding: 0; flex: none; }
.row .tw .i { width: 11px; height: 11px; transition: transform .12s; }
.row .tw.open .i { transform: rotate(90deg); }
.row .nm { flex: 1; min-width: 40px; overflow: hidden; text-overflow: ellipsis; }
.row .nm mark { background: none; color: var(--accent); }
.row .proj-of { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
.row.proj { font-weight: 600; height: 26px; margin-top: 4px; }
.row .rn { flex: 1; min-width: 0; height: 20px; border: 1px solid var(--accent); border-radius: 4px; background: var(--panel2); padding: 0 5px; outline: none; font-size: 12.5px; }
.ty { color: var(--dim); }
.ty.t-project { color: var(--accent); } .ty.t-assembly { color: var(--t-object); } .ty.t-assembly.linked { color: var(--link); } .ty.t-area { color: var(--area); } .ty.t-folder { color: var(--t-folder); } .ty.t-object { color: var(--t-object); } .ty.t-loose { color: var(--gutter); } .ty.t-cutter { color: var(--bool); }
.bdg { display: inline-flex; align-items: center; gap: 3px; height: 16px; padding: 0 5px; border-radius: 4px; background: var(--chip); color: var(--dim); font: 500 10.5px var(--f-mono); flex: none; }
.bdg .i { width: 11px; height: 11px; }
.bdg .arr { color: var(--accent); display: inline-flex; align-items: center; gap: 2px; } .bdg .bool { color: var(--bool); display: inline-flex; } .bdg .off { color: var(--gutter) !important; }
.bdg.lnk { color: var(--link); } .bdg.prio { color: var(--fg); } .bdg.act { background: var(--accent); color: var(--on-accent) !important; font: 600 10px var(--f-ui); letter-spacing: .04em; }
.bdg.trim { color: var(--err) !important; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.eye { border: 0; background: transparent; color: var(--gutter); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; padding: 0; flex: none; }
.eye:hover { color: var(--fg); background: var(--btn); }
.row.hid .eye { color: var(--dim); }
.eye.lockg { pointer-events: none; }
.eye .i { width: 13px; height: 13px; }
/* drag and drop */
.row.dragging { opacity: .45; }
.row.drop-into { background: #21403b80; box-shadow: inset 0 0 0 1px var(--accent); }
.row.drop-bad { background: #f074701a; }
.dropline { position: absolute; height: 2px; background: var(--accent); pointer-events: none; z-index: 2; }
.dropline::before { content: ""; position: absolute; left: -6px; top: -3px; width: 6px; height: 6px; border: 2px solid var(--accent); border-radius: 50%; background: var(--panel); }
.empty { padding: 18px 6px; color: var(--dim); text-align: center; font-size: 12.5px; line-height: 1.6; }
.empty .btn { margin-top: 8px; }
.linkb { border: 0; background: none; padding: 0; color: var(--accent); }
.linkb:hover { text-decoration: underline; }

/* properties */
.ph { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.ph input { flex: 1; min-width: 0; height: 26px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--btn); font-weight: 600; }
.ph input:focus { border-color: var(--accent); outline: none; }
.ph .ttl { font-weight: 600; flex: 1; }
.file { font: 11px var(--f-mono); color: var(--dim); margin: 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: copy; display: flex; gap: 5px; align-items: center; }
.file.lnk { color: var(--link); }
.file .i { width: 12px; height: 12px; }
.sec { border-top: 1px solid var(--line2); padding: 8px 0 8px; display: flex; flex-direction: column; gap: 6px; }
.sec > h4 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.sec > h4 .sp { flex: 1; }
.fr { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; }
.fr > span { color: var(--dim); font-size: 12px; }
.axr { display: flex; gap: 3px; align-items: stretch; }
.num { display: flex; align-items: center; height: 24px; border-radius: 5px; background: var(--btn); border: 1px solid var(--line); overflow: hidden; flex: 1; min-width: 0; }
.num:focus-within { border-color: var(--accent); }
.num i { font-style: normal; font: 600 10.5px var(--f-mono); width: 18px; text-align: center; align-self: stretch; display: grid; place-items: center; cursor: ew-resize; flex: none; }
.num.x i { background: #f0605e22; color: var(--ax-x); } .num.y i { background: #8ad27e22; color: var(--ax-y); } .num.z i { background: #5b9cf022; color: var(--ax-z); }
.num input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none; padding: 0 6px; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.num input::-webkit-inner-spin-button { display: none; }
.stp { width: 24px; height: 24px; flex: none; border: 1px solid var(--line); border-radius: 5px; background: var(--btn); color: var(--dim); padding: 0; font: 500 13px var(--f-mono); line-height: 1; }
.stp:hover { color: var(--fg); border-color: var(--gutter); }
.xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg { display: flex; background: var(--btn); border: 1px solid var(--line); border-radius: 5px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--dim); height: 19px; border-radius: 3px; font: 12px var(--f-mono); white-space: nowrap; padding: 0 4px; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--panel2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.seg.ui button { font-family: var(--f-ui); }
.btn { height: 25px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--gutter); background: var(--chip); }
.btn:disabled { color: var(--gutter); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.pri:hover { background: #5ec4b6d9; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.danger { color: var(--err); }
.btn.wide { flex: 1; }
.btn.sq { width: 25px; padding: 0; }
.brow { display: flex; gap: 4px; flex-wrap: wrap; }
.brow .btn { flex: 1 1 auto; }
.mod { position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); overflow: hidden; }
.mod::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.mod.m-bool::before { background: var(--bool); }
.mod.off::before { background: var(--gutter); }
.mod.off .mod-h .ttl, .mod.off .mod-h .ty { color: var(--dim); }
.mod.dropb { box-shadow: 0 -2px 0 var(--accent); } .mod.dropa { box-shadow: 0 2px 0 var(--accent); }
.mod-h { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 4px 0 6px; font-weight: 600; font-size: 12.5px; }
.mod:not(.coll) .mod-h { border-bottom: 1px solid var(--line2); }
.mod-h .grip { color: var(--gutter); cursor: ns-resize; display: grid; place-items: center; width: 12px; }
.mod-h .grip:hover { color: var(--fg); }
.mod-h .sum { color: var(--dim); font-weight: 400; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mod-h .sp { flex: 1; }
.mod-h .ty { color: var(--accent); } .mod.m-bool .mod-h .ty { color: var(--bool); }
.mod.coll .mod-b { display: none; }
.mod-b { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.sw { width: 26px; height: 14px; border-radius: 7px; background: var(--track); border: 0; padding: 0; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); transition: left .12s; }
.sw.on { background: var(--accent); } .sw.on::after { left: 14px; background: var(--on-accent); }
.note { font-size: 11.5px; color: var(--dim); line-height: 1.45; margin: 0; }
.note.err { color: var(--err); } .note.warnc { color: var(--warn); } .note b { color: var(--fg); font-weight: 600; }
.note.err b { color: var(--err); }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; } .kv b { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.bignum { font: 600 26px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.stat { display: flex; gap: 14px; flex-wrap: wrap; }
.stat > div { display: flex; flex-direction: column; gap: 2px; } .stat small { color: var(--dim); font-size: 11px; }
.selc { width: 100%; min-width: 0; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--btn); padding: 0 6px; font-size: 12px; }
.banner { border: 1px solid #7fc8f080; background: var(--panel2); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.banner p { margin: 0; font-size: 12px; display: flex; gap: 6px; } .banner .i { color: var(--link); margin-top: 1px; }
.stline { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-align: left; margin-top: 12px; }
.card h5 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; }
.card h5 .sp { flex: 1; }
.card .tr { display: grid; grid-template-columns: 1fr auto 1.2fr; gap: 6px; font-size: 11.5px; padding: 3px 0; align-items: baseline; }
.card .tr span:first-child { color: var(--dim); } .card .tr span:nth-child(2) { color: var(--gutter); }
.card .tr small { display: block; color: var(--dim); font-size: 11px; }
.sellist { display: flex; flex-direction: column; gap: 2px; }
.sellist button { text-align: left; border: 0; background: transparent; border-radius: 4px; height: 22px; padding: 0 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.sellist button:hover { background: var(--chip); }
.sellist button.act { background: var(--sel); }

/* map */
.map-tools { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 11px; color: var(--dim); }
.map-tools .sp { flex: 1; }
#map { display: block; width: 100%; height: 180px; border-radius: 6px; background: var(--slot); cursor: default; }
.maplg { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.maplg span { display: inline-flex; align-items: center; gap: 4px; }
.maplg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* status bar */
#status { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--panel2); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); z-index: 30; white-space: nowrap; overflow: hidden; }
#status .hints { display: flex; gap: 10px; flex: 1; min-width: 0; overflow: hidden; }
#status .hints span { display: inline-flex; gap: 4px; align-items: center; flex: none; }
#status .hints .mchip { background: var(--sel); color: var(--accent); border-radius: 4px; padding: 0 6px; font-weight: 600; }
#status .hints .bad { color: var(--err); }
#status .rt { display: flex; gap: 14px; align-items: center; min-width: 0; }
#status .rt > span { display: inline-flex; gap: 5px; align-items: center; }
#status .rt .selt { color: var(--fg); overflow: hidden; text-overflow: ellipsis; min-width: 0; display: block; }
#status .linkb { font-size: 11.5px; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--warn); border-right-color: transparent; animation: sp .7s linear infinite; display: inline-block; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }

/* menus */
.menu { position: fixed; z-index: 100; min-width: 230px; max-width: calc(100vw - 16px); padding: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 12px 36px #000a; font-size: 12.5px; }
.menu .mh { padding: 5px 8px 4px; font-size: 10.5px; color: var(--dim); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }

}
function windowsItems() {

  return [I('Scene', null, tog('w-scene'), { check: w('w-scene') }), I('Properties', null, tog('w-props'), { check: w('w-props') }), I('Top view', null, tog('w-map'), { check: w('w-map') }),
    I('Hide all windows', null, () => $('#stage').classList.toggle('nowin'), { check: $('#stage').classList.contains('nowin'), key: 'Tab' }), SEP,

function helpMenu(x, y) {
  closeMenu();
  const el = document.createElement('div'); el.className = 'menu help'; el._level = 0;
  el.innerHTML = `<h6>Camera</h6><div class="kl"><kbd>MMB</kbd><span>orbit · <kbd>Shift</kbd> pan · wheel zoom</span><kbd>hold RMB</kbd><span>fly with W A S D, Q E · wheel = speed</span><kbd>F</kbd><span>frame the selection</span></div>
    <h6>Editing</h6><div class="kl"><kbd>G</kbd><span>move, then X/Y/Z and a number, Enter</span><kbd>R</kbd><span>rotate in 90° steps · <kbd>M</kbd> mirror X</span><kbd>Shift D</kbd><span>duplicate · <kbd>Alt D</kbd> linked duplicate</span><kbd>B</kbd><span>box select · <kbd>A</kbd> all · <kbd>Alt A</kbd> none</span><kbd>H</kbd><span>hide · <kbd>Alt H</kbd> show all · <kbd>/</kbd> local view</span></div>
    <h6>Nothing is final until you say so</h6><p>Arrays and Booleans are modifiers: they stay editable. <b>Realise</b> turns an array into separate objects, <b>Apply</b> writes a Boolean result as a new .litematic, <b>Bake</b> exports one .litematic for players without the mod.</p>`;
  document.body.append(el); menus.push(el);
  const r = el.getBoundingClientRect(); el.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px'; el.style.top = y + 'px';

$('#toolbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tool) { tool = b.dataset.tool; return renderAll(); }
  const r = b.getBoundingClientRect();
  ({ mirror: mirrorSel, snap: () => { snapOn = !snapOn; renderToolbar(); }, local: toggleLocal, undo: doUndo, redo: doRedo, push: () => act('push'),
     leave: () => toast('F6 leaves the editor: windows fade out and the game takes the mouse again'),
     add: () => openMenu(r.left, r.bottom + 6, addItems(), 'Add to ' + (activeProject()?.name || 'scene')),
     box: () => { boxArmed = !boxArmed; setCursor(); renderToolbar(); hud(); draw(); },
     windows: () => openMenu(r.left, r.bottom + 6, windowsItems()),
     help: () => helpMenu(r.right - 340, r.bottom + 6),
     more: () => openMenu(r.right - 230, r.bottom + 6, [I(`Push to Syncmatica (${pendingSync})`, 'sync', () => act('push'), { dis: !pendingSync }), I('Mirror X', 'mirror', mirrorSel, { key: 'M', dis: !movable().length }), SEP, I('Snap', 'magnet', () => { snapOn = !snapOn; renderToolbar(); }, { check: snapOn }), I('Local view', 'local', toggleLocal, { key: '/' }), I('Undo', 'undo', doUndo, { key: 'Ctrl Z', dis: !undo.length }), I('Redo', 'redo', doRedo, { dis: !redo.length }), I('Pivot', 'local', null, { sub: ['Median', 'Active object', 'Bounding box'].map(p => I(p, null, () => { pivot = p; renderAll(); }, { check: pivot === p })) }), I('Windows', 'layout', null, { sub: windowsItems() }), I('Quick guide', 'help', () => helpMenu(8, r.bottom + 6))]),
  })[b.dataset.b]?.();

$('#toolbar').addEventListener('change', e => { if (e.target.id === 'pivot') { pivot = e.target.value; renderAll(); } });
function hints() {
  const h = (k, t) => `<span>${k.split('|').map(x => `<kbd>${x}</kbd>`).join('')} ${t}</span>`;
  let pre = localView ? '<span class="mchip">Local view</span>' + h('/', 'leave') : '';
  if (treeDrag) return dropState?.bad ? `<span class="bad">${esc(dropState.bad)}</span>` : 'Drop <b style="color:var(--fg);font-weight:500">between</b> rows to reorder · <b style="color:var(--fg);font-weight:500">on</b> a folder, project or local assembly to move in · ' + h('Esc', 'cancel');
  if (renaming) return h('Enter', 'rename') + h('Esc', 'cancel');
  if (pickMode) return 'Click the cutter object ' + h('Esc', 'cancel');
  if (tt) return h('0–9', 'number') + h('X|Y|Z', 'axis') + h('−', 'negate') + h('Backspace', '') + h('Enter', 'confirm') + h('Esc', 'cancel');
  if (box || boxArmed) return h('drag', 'select') + h('Shift', 'add') + h('Ctrl', 'subtract') + h('Esc', 'cancel');
  if (flying) return h('W|A|S|D', 'move') + h('Q|E', 'down/up') + h('Shift', 'fast') + h('Wheel', 'speed') + h('release RMB', 'stop');
  if (drag?.kind === 'ring') return h('RMB|Esc', 'cancel') + h('release', 'apply');
  if (drag) return h('Ctrl', snapOn ? 'snap off' : 'snap on') + h('0–9', 'type the distance') + h('RMB|Esc', 'cancel') + h('release', 'place');
  if (gHover?.type === 'axis') return h('drag', 'move along ' + AXN[gHover.axis].toUpperCase()) + h('Ctrl', 'hold to ' + (snapOn ? 'turn snapping off' : 'snap'));
  if (gHover?.type === 'plane') return h('drag', 'move on the ground (X and Z)') + h('Ctrl', 'snap off');
  if (gHover?.type === 'ring') return h('click', '+90°') + h('Shift click', '−90°') + h('drag', 'rotate in 90° steps');
  if (sel.length) return pre + h('G', 'move') + h('R', 'rotate') + h('M', 'mirror') + h('Shift D', 'duplicate') + h('H', 'hide') + h('X', 'delete') + h('F', 'frame') + h('RMB', 'menu');
  return pre + h('LMB', 'select') + h('drag', 'box select') + h('MMB', 'orbit') + h('Shift MMB', 'pan') + h('Wheel', 'zoom') + h('hold RMB', 'fly') + h('RMB', 'menu') + h('Shift A', 'add');
}
function renderStatus() {
  const busy = performance.now() < regenUntil;
  const n = byId[sel[0]];
  let selTxt = 'Nothing selected';
  if (sel.length > 1) { const bb = selBox(sel, false); selTxt = `${sel.length} objects` + (bb ? ` · ${[0,1,2].map(k => Math.round(bb[1][k]-bb[0][k])).join('×')}` : ''); }
  else if (n) { const bb = selBox([n.id], true); selTxt = n.name + (bb ? ` · ${[0,1,2].map(k => Math.round(bb[1][k]-bb[0][k])).join('×')} at ${bb[0].map(Math.round).join(', ')}` : '') + (arrayMod(n) ? ` · array ×${arrayMod(n).count}` : ''); }
  const shared = tree.some(p => p.sync === 'shared');
  $('#status').innerHTML = `<div class="hints">${hints()}</div>
    <div class="rt"><span class="selt">${esc(selTxt)}</span>

      ${shared ? `<span><span class="sdot" style="background:${pendingSync ? 'var(--warn)' : 'var(--ok)'}"></span>${pendingSync ? pendingSync + ' change' + (pendingSync > 1 ? 's' : '') + ' not pushed' : 'Syncmatica up to date'}</span>` : ''}</div>`;

function renderAll() { reindex(); sel = sel.filter(id => byId[id]); draw(); renderTree(); renderProps(); renderToolbar(); renderStatus(); drawMap(); }

/* ---------- windows: drag by header, bring to front, close ---------- */
let zTop = 21;
document.querySelectorAll('.win').forEach(w => {
  w.addEventListener('mousedown', () => { w.style.zIndex = ++zTop; });
  const h = w.querySelector('[data-drag]');
  h.addEventListener('mousedown', e => {
    if (matchMedia('(max-width: 860px)').matches || e.button !== 0 || e.target.closest('button')) return;
    const app = $('#app').getBoundingClientRect(), r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    w.style.right = 'auto'; w.style.bottom = 'auto'; w.style.left = (r.left - app.left) + 'px'; w.style.top = (r.top - app.top) + 'px';
    const mv = ev => { w.style.left = Math.max(0, Math.min(app.width - 80, ev.clientX - app.left - dx)) + 'px'; w.style.top = Math.max(0, Math.min(app.height - 32, ev.clientY - app.top - dy)) + 'px'; };

    addEventListener('mousemove', mv); addEventListener('mouseup', up); e.preventDefault();

document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { $('#' + b.dataset.close).hidden = true; toast('Window closed. Reopen it from the Windows menu in the toolbar'); }));

/* ---------- toasts ---------- */
function toast(html, o = {}) {
  const t = document.createElement('div'); t.className = 'toast ' + (o.level || ''); t.innerHTML = `<span>${html}</span>` + (o.action ? `<button class="ta">${esc(o.action)}</button>` : '');
  if (o.action) t.querySelector('.ta').addEventListener('click', () => { t.remove(); o.fn(); });
  $('#toasts').append(t);
  let left = o.level === 'error' ? 8000 : o.level === 'warn' ? 5000 : 3600, timer, t0;
  const run = () => { t0 = Date.now(); timer = setTimeout(() => t.remove(), left); };
  t.addEventListener('mouseenter', () => { clearTimeout(timer); left -= Date.now() - t0; }); t.addEventListener('mouseleave', run); run();
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}

reindex(); sel = [tree[0].children[0].children[0].id]; renderAll();
